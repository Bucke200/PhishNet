# PhishNet Tier-2 fetcher — Cloud Run Service (deployment-plan §5).
# Declarative source of truth; applied by deploy/deploy_cloudrun.sh via
# `gcloud run services replace`. Image is rewritten by the deploy script
# to <region>-docker.pkg.dev/<project>/phishnet-repo/fetcher:<tag>.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: phishnet-fetcher
  labels:
    app: phishnet
    tier: tier2-fetcher
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 10
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/phishnet-repo/fetcher:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1.5Gi
              cpu: "1"
          env:
            - name: PHISHNET_FETCH_TIMEOUT
              value: "8"
            - name: PHISHNET_FETCHER_RENDER
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
