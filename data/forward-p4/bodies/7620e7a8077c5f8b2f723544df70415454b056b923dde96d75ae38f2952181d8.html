<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amazon Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>
        <div class="navbar">

            <!-- Logo -->
            <div class="nav-logo">
                <div class="logo">
                    amazon
                    <span>⌣</span>
                </div>
            </div>

            <!-- Address -->
            <div class="nav-address">
                <p class="add-first">Deliver to</p>

                <div class="add-icon">
                    <span>📍</span>
                    <p class="add-second">India</p>
                </div>
            </div>

            <!-- Search -->
            <div class="nav-search">

                <select>
                    <option>All</option>
                </select>

                <input type="text" placeholder="Search Amazon">

                <button class="search-icon">🔍</button>

            </div>

            <!-- Sign In -->
            <div class="nav-signin">
                <p>Hello, Sign in</p>
                <h4>Account & Lists</h4>
            </div>

            <!-- Returns -->
            <div class="nav-return">
                <p>Returns</p>
                <h4>& Orders</h4>
            </div>

            <!-- Cart -->
            <div class="nav-cart">
                🛒
                <b>Cart</b>
            </div>

        </div>
    </header>


    <!-- ================= HERO ================= -->

    <section class="hero-section">

        <div class="hero-content">

            <div class="hero-box">
                <div class="package package1">📦</div>
                <div class="package package2">📦</div>
                <div class="package package3">📦</div>
            </div>

            <div class="hero-msg">
                <p>Welcome to Amazon Clone</p>
            </div>

        </div>

    </section>


    <!-- ================= SHOP SECTION ================= -->

    <section class="shop-section">


        <!-- CLOTHES -->

        <div class="box">

            <h2>Clothes</h2>

            <div class="product-image clothes-image">

                <div class="shirt shirt1"></div>
                <div class="shirt shirt2"></div>
                <div class="shirt shirt3"></div>
                <div class="shirt shirt4"></div>
                <div class="shirt shirt5"></div>

            </div>

            <p>See more</p>

        </div>


        <!-- ELECTRONICS -->

        <div class="box">

            <h2>Electronics</h2>

            <div class="product-image electronics-image">

                <div class="headphone">
                    🎧
                </div>

                <div class="speaker">
                    🔊
                </div>

                <div class="watch">
                    ⌚
                </div>

            </div>

            <p>See more</p>

        </div>


        <!-- HOME -->

        <div class="box">

            <h2>Home</h2>

            <div class="product-image home-image">

                <div class="sofa">
                    🛋️
                </div>

                <div class="lamp">
                    🛋️
                </div>

                <div class="plant">
                    🪴
                </div>

            </div>

            <p>See more</p>

        </div>


        <!-- BEAUTY -->

        <div class="box">

            <h2>Beauty</h2>

            <div class="product-image beauty-image">

                <div class="beauty-item">
                    💄
                </div>

                <div class="beauty-item">
                    🧴
                </div>

                <div class="beauty-item">
                    💅
                </div>

                <div class="beauty-item">
                    🪮
                </div>

            </div>

            <p>See more</p>

        </div>


    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Amazon Clone | Made by Akash Kumar
        </p>

    </footer>


</body>

</html>
