        }

            margin-top: 16px;
            margin-bottom: 16px;
        }
        input[type="email"] {
            width: 100%;

            font-size: 16px;

            border-radius: 4px;

            text-decoration: underline;

        }
        .create-account {
            color: #0b57d0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .create-account:hover {
            text-decoration: underline;
        }
        button[type="submit"] {
            background-color: #0b57d0;
            color: white;
            border: none;
            border-radius: 100px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button[type="submit"]:hover {
            background-color: #0842a0;
        }

        @media (max-width: 600px) {
            body {

                align-items: flex-start;
                padding: 16px;

                max-width: 100%;

            }
            .button-row {
