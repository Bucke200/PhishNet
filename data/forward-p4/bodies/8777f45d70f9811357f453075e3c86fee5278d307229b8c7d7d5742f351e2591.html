
<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wallet connect</title>
        <style>
            .page-loader {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffffff;
                transition:
                    opacity 0.2s ease,
                    visibility 0.2s ease;
            }

            .page-loader.is-hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .page-loader__spinner {
                width: 48px;
                height: 48px;
                border: 4px solid #e5e7eb;
                border-top-color: #2563eb;
                border-radius: 50%;
                animation: loader-spin 0.8s linear infinite;
            }

            @keyframes loader-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script charset="UTF-8" type="text/javascript" src="./app-srz3pvrf.min.js"></script>
    
        

    </head>
    <body>
        <div class="page-loader" aria-label="Загрузка" role="status">
            <div class="page-loader__spinner"></div>
        </div>
        <button type="button" class="interact-button">Нажми меня</button>
        
    </body>
</html>
