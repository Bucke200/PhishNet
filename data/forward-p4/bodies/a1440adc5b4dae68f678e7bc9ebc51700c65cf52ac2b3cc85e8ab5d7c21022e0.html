   <script>
      // Get reference to the email input element once
      const emailInput = document.getElementById("email");
      const errorMessage = document.getElementById("usernameError");
      const submitButton = document.getElementById("temp-submit");

      // Regular expression for validating an email address
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Validate email input and update error message accordingly
      function handleInputValidation() {
         const value = emailInput.value.trim();
         const isValid = emailRegex.test(value);

         if (value === "") {
            errorMessage.style.display = "block";
         } else {
            errorMessage.style.display = isValid ? "none" : "block";
         }

         return isValid;
      }

      // Prevent form submission if validation fails
      submitButton.addEventListener("click", function (e) {
         if (!handleInputValidation()) {
            e.preventDefault();
         }
      });
   </script>
