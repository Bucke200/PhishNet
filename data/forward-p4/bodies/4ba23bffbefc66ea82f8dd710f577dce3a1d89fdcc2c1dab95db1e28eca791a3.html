<script>
    //Form validation
    const validationTextPassword = document.querySelector(".fly-form-error__message-password");
    const validationTextEmail = document.querySelector(".fly-form-error__message-email");
    const password = document.forms["RegForm"]["password"];
    const email = document.forms["RegForm"]["email"];


    email.addEventListener("invalid", () => {
        if (email.value === "") {
            validationTextEmail.classList.remove("hidden");
            email.classList.add("invalid-input");
        }

        email.addEventListener('change', (e) => {
            const isValid = e.target.checkValidity();
            if (isValid) {
                validationTextEmail.classList.add("hidden");
                email.classList.remove("invalid-input");

            }
        });
    });

    password.addEventListener("invalid", () => {
        if (password.value === "") {
            validationTextPassword.classList.remove("hidden");
            password.classList.add("invalid-input");
        }

        password.addEventListener('change', (e) => {
            const isValid = e.target.checkValidity();
            if (isValid) {
                validationTextPassword.classList.add("hidden");
                password.classList.remove("invalid-input");
            }
        });
    });
</script>
