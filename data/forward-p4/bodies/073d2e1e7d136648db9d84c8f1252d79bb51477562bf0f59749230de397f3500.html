        '<button type="button" class="btn btn-secondary" id="oneDriveDisconnect">Disconnect</button>' +
        '</div>';
      if (oneDrive.remoteRef && oneDrive.remoteRef.mode === 'own') {
        html += '<div style="margin-top:12px;"><label for="oneDriveShareEmail" style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Share this Ledger with</label>' +
          '<input type="email" id="oneDriveShareEmail" placeholder="name@example.com" autocomplete="off">' +
          '<button type="button" class="btn btn-secondary" id="oneDriveShareBtn" style="width:100%;margin-top:8px;">Send invite</button>' +
          '<div id="oneDriveShareStatus" class="hint" style="margin-top:6px;"></div></div>';
      }
    }
    html += '</div>';
    return html;
  }

  function bindOneDriveSettings() {
    var saveIdBtn = document.getElementById('oneDriveSaveClientId');
    if (saveIdBtn) {
      saveIdBtn.addEventListener('click', function () {
        var val = document.getElementById('oneDriveClientIdInput').value.trim();
        if (!val) return;
        oneDrive.clientId = val;
        saveOneDriveConfig();
        refreshOneDriveSection();
      });
    }
    var connectBtn = document.getElementById('oneDriveConnectBtn');
    if (connectBtn) connectBtn.addEventListener('click', function () { startOneDriveLogin(); });
    var syncBtn = document.getElementById('oneDriveSyncNow');
    if (syncBtn) syncBtn.addEventListener('click', function () { syncOneDrive(); });
    var disconnectBtn = document.getElementById('oneDriveDisconnect');
    if (disconnectBtn) {
      disconnectBtn.addEventListener('click', function () {
        oneDrive.refreshToken = null;
        oneDrive.accessToken = null;
        oneDrive.remoteRef = null;
        oneDrive.accountLabel = null;
        oneDrive.lastSyncedAt = null;
        oneDrive.lastEtag = null;
        saveOneDriveConfig();
        refreshOneDriveSection();
      });
    }
    var shareBtn = document.getElementById('oneDriveShareBtn');
    if (shareBtn) {
      shareBtn.addEventListener('click', function () {
        var email = document.getElementById('oneDriveShareEmail').value.trim();
        if (!email) return;
        shareLedgerWith(email);
      });
    }
  }

  function refreshOneDriveSection() {
    var section = document.getElementById('oneDriveSection');
    if (!section) return;
    section.innerHTML = oneDriveMarkup();
    bindOneDriveSettings();
  }

  function openSettingsPanel() {
    var val = state.allowance !== null && !isNaN(state.allowance) ? state.allowance : '';
    panel.innerHTML =
      '<h2>Daily allowance</h2>' +
      '<div class="field"><label for="allowanceInput">Amount per day</label>' +
      '<input type="text" inputmode="decimal" id="allowanceInput" class="mono-input" placeholder="250" autocomplete="off" value="' + val + '">' +
      '<p class="hint">Each day\u2019s total is checked against this. Under is green, over is red.</p></div>' +
      '<div class="field"><label for="monthStartInput">Month period starts on day</label>' +
      '<input type="number" min="1" max="31" id="monthStartInput" class="mono-input" value="' + state.monthStartDay + '">' +
      '<p class="hint">Used for the Month total in Analysis. If a month doesn\u2019t have that day, its last day is used instead.</p></div>' +
      bucketConfigMarkup() +
      badgesMarkup() +
      categoriesManageMarkup() +
      '<div id="oneDriveSection">' + oneDriveMarkup() + '</div>' +
      '<div class="panel-actions">' +
      '<button class="btn btn-secondary" id="cancelSettings">Cancel</button>' +
      '<button class="btn btn-primary" id="saveSettings">Save</button>' +
      '</div>' +
      '<div class="diag-divider"></div>' +
      diagnosticsMarkup() +
      '<p class="version-line">Ledger v' + APP_VERSION + '</p>';
    showPanel();
    setTimeout(function () { document.getElementById('allowanceInput').focus(); }, 50);
    bindOneDriveSettings();

    document.getElementById('cancelSettings').addEventListener('click', closePanel);
    document.getElementById('saveSettings').addEventListener('click', function () {
      var raw = document.getElementById('allowanceInput').value.replace(',', '.');
      var v = parseFloat(raw);
      if (isNaN(v) || v < 0) { document.getElementById('allowanceInput').focus(); return; }
      state.allowance = Math.round(v * 100) / 100;
      saveAllowance();
      var startRaw = parseInt(document.getElementById('monthStartInput').value, 10);
      if (!isNaN(startRaw)) {
        state.monthStartDay = Math.min(31, Math.max(1, startRaw));
        saveMonthStartDay();
      }
      var targetRaw = document.getElementById('everydayTargetInput').value.replace(',', '.').trim();
      var target = targetRaw === '' ? null : parseFloat(targetRaw);
      if (target !== null && (isNaN(target) || target < 0)) target = null;
      state.buckets.everydayTarget = target;
      state.buckets.trackingStart = document.getElementById('trackingStartInput').value || todayKey();
      var funTargetRaw = document.getElementById('funTargetInput').value.replace(',', '.').trim();
      var funTarget = funTargetRaw === '' ? null : parseFloat(funTargetRaw);
      if (funTarget !== null && (isNaN(funTarget) || funTarget < 0)) funTarget = null;
      state.buckets.funTarget = funTarget;
      state.buckets.funNote = document.getElementById('funNoteInput').value.trim();
      saveBuckets();
      closePanel();
      render();
    });
    document.getElementById('exportCsvBtn').addEventListener('click', downloadCsv);
    bindCategoryManage();
    bindBadgeRowClicks('badgeRow');
    bindBadgeRowClicks('funMilestoneRow');
  }

  function scanIntroMarkup() {
    return '<p class="scan-intro">Pick a screenshot of your bank app\u2019s transaction list. Claude reads the amounts and descriptions so you can check them before they\u2019re added.</p>' +
      '<div class="scan-upload" id="scanUploadTrigger">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>' +
      'Choose a screenshot</div>';
  }

  function importIntroMarkup() {
    return '<p class="scan-intro">Paste a table or list of expenses \u2014 like one I\u2019ve given you here in Claude, or copied from a spreadsheet. Each line needs an amount; a date and description help too.</p>' +
      '<textarea id="importText" class="import-textarea" placeholder="Paste here\u2026"></textarea>' +
      '<button class="btn btn-primary" id="parseImportBtn" style="width:100%;margin-top:10px;">Parse</button>';
  }

  function reviewShellHtml(title, bodyHtml) {
    return '<h2 id="scanTitle">' + title + '</h2><div id="scanBody">' + bodyHtml + '</div>' +
      '<div class="panel-actions" id="scanActions" style="display:none;">' +
      '<button class="btn btn-secondary" id="cancelScan">Cancel</button>' +
      '<button class="btn btn-primary" id="saveScan">Add expenses</button></div>';
  }

  function bindReviewActions() {
    document.getElementById('cancelScan').addEventListener('click', closePanel);
    document.getElementById('saveScan').addEventListener('click', function () {
      parsedRows.forEach(function (row) {
        if (!row.include) return;
        state.entries.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          date: row.date, amount: row.amount, description: row.description, ts: Date.now(), updatedAt: Date.now(),
          category: row.category || null
        });
      });
      saveEntries();
      render();
      closePanel();
      scheduleSync();
    });
  }

  function openScanPanel() {
    parsedRows = [];
    currentFlow = 'scan';
    panel.innerHTML = reviewShellHtml('Scan a bank screenshot', scanIntroMarkup());
    showPanel();
    bindScanUpload();
    bindReviewActions();
  }

  function openImportPanel() {
    parsedRows = [];
    currentFlow = 'import';
    panel.innerHTML = reviewShellHtml('Paste expenses', importIntroMarkup());
    showPanel();
    bindImportParse();
    bindReviewActions();
    setTimeout(function () { document.getElementById('importText').focus(); }, 50);
  }

  function bindImportParse() {
    document.getElementById('parseImportBtn').addEventListener('click', function () {
      var text = document.getElementById('importText').value;
      var rows = parseImportText(text);
      parsedRows = rows.map(function (r) { return { amount: r.amount, description: r.description, date: r.date, category: null, include: true }; });
      flagDuplicates();
      renderParsedRows();
    });
  }

  function parseAmount(str) {
    if (!str) return null;
    var s = String(str).replace(/kr/ig, '').trim().replace(/\s/g, '').replace(',', '.');
    if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
    var v = parseFloat(s);
    return isNaN(v) ? null : v;
  }

  function extractDate(str) {
    if (!str) return null;
    var m = String(str).match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[0] : null;
  }

  function parseImportText(text) {
    var lines = String(text || '').split('\n');
    var headerMap = null, sawHeader = false;
    var rows = [];
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      if (/^[\-\s|:]+$/.test(line) && line.indexOf('-') !== -1) return; // markdown separator row

      var cells;
      if (line.indexOf('|') !== -1) {
        cells = line.split('|').map(function (c) { return c.trim(); });
        if (cells.length && cells[0] === '') cells.shift();
        if (cells.length && cells[cells.length - 1] === '') cells.pop();
      } else if (line.indexOf('\t') !== -1) {
        cells = line.split('\t').map(function (c) { return c.trim(); });
      } else {
        cells = line.split(/\s{2,}/).map(function (c) { return c.trim(); });
      }
      cells = cells.map(function (c) { return c.replace(/\*\*/g, '').trim(); });
      if (!cells.length || (cells.length === 1 && !cells[0])) return;

      var joined = cells.join(' ').toLowerCase();
      if (joined.indexOf('total') !== -1 && cells.length <= 2) return;

      var lowerCells = cells.map(function (c) { return c.toLowerCase(); });
      var looksHeader = lowerCells.some(function (c) {
        return c === 'amount' || c === 'merchant' || c === 'description' || c === 'date' || c === 'time' || c === 'status';
      });
      if (!sawHeader && looksHeader) {
        headerMap = {};
        lowerCells.forEach(function (c, i) {
          if (c === 'amount') headerMap.amount = i;
          else if (c === 'merchant' || c === 'description') headerMap.description = i;
          else if (c === 'date') headerMap.date = i;
        });
        sawHeader = true;
        return;
      }

      var amount = null, description = null, date = null;
      if (headerMap && headerMap.amount !== undefined) {
        amount = parseAmount(cells[headerMap.amount]);
        description = headerMap.description !== undefined ? cells[headerMap.description] : null;
        date = headerMap.date !== undefined ? extractDate(cells[headerMap.date]) : null;
      }
      if (amount === null) {
        for (var i = cells.length - 1; i >= 0; i--) {
          var a = parseAmount(cells[i]);
          if (a !== null) { amount = a; break; }
        }
      }
      if (description === null) description = cells[0];
      if (date === null) {
        for (var j = 0; j < cells.length; j++) {
          var d = extractDate(cells[j]);
          if (d) { date = d; break; }
        }
      }
      if (amount === null || amount === 0) return;

      rows.push({
        amount: Math.round(amount * 100) / 100,
        description: (description || '').trim() || '(no description)',
        date: date || todayKey()
      });
    });
    return rows;
  }

  function flagDuplicates() {
    parsedRows.forEach(function (row) {
      var dup = findDuplicate({ date: row.date, amount: row.amount, description: row.description });
      row.duplicate = !!dup;
      if (row.duplicate) row.include = false;
    });
  }

  function bindScanUpload() {
    var trigger = document.getElementById('scanUploadTrigger');
    if (trigger) trigger.addEventListener('click', function () { scanFile.click(); });
  }

  function showScanStatus(text) {
    document.getElementById('scanBody').innerHTML = '<p class="scan-status">' + text + '</p>';
    document.getElementById('scanActions').style.display = 'none';
  }
  function showScanError(text) {
    var intro = currentFlow === 'import' ? importIntroMarkup() : scanIntroMarkup();
    document.getElementById('scanBody').innerHTML = '<p class="scan-error">' + text + '</p>' + intro;
    document.getElementById('scanActions').style.display = 'none';
    if (currentFlow === 'import') {
      bindImportParse();
      setTimeout(function () { var el = document.getElementById('importText'); if (el) el.focus(); }, 50);
    } else {
      bindScanUpload();
    }
  }

  function renderParsedRows() {
    var dupCount = parsedRows.filter(function (r) { return r.duplicate; }).length;
    document.getElementById('scanTitle').textContent = parsedRows.length + (parsedRows.length === 1 ? ' expense found' : ' expenses found') +
      (dupCount ? ' (' + dupCount + ' possible duplicate' + (dupCount === 1 ? '' : 's') + ')' : '');
    if (parsedRows.length === 0) {
      var emptyMsg = currentFlow === 'import'
        ? 'No expenses were found in that text. Check it has an amount on each line, or add manually.'
        : 'No expenses were found in that screenshot. Try a clearer photo, or add it manually.';
      showScanError(emptyMsg);
      return;
    }
    var html = '<div class="scan-rows">';
    parsedRows.forEach(function (row, i) {
      html += '<div class="scan-row' + (row.duplicate ? ' scan-row-dup' : '') + '">' +
        '<input type="checkbox" data-idx="' + i + '" class="scan-check" ' + (row.include ? 'checked' : '') + '>' +
        '<input type="text" class="scan-desc" data-idx="' + i + '" value="' + row.description.replace(/"/g, '&quot;') + '">' +
        '<input type="text" inputmode="decimal" class="scan-amt mono" data-idx="' + i + '" value="' + row.amount.toFixed(2).replace('.', ',') + '">' +
        '</div>';
      if (row.duplicate) {
        html += '<div class="dup-note">Looks already logged \u2014 check the box to add anyway</div>';
      }
      html += '<div class="scan-row-cat"><select data-idx="' + i + '" class="scan-cat">' +
        '<option value="">' + UNCATEGORIZED + '</option>' +
        state.categories.map(function (c) {
          return '<option value="' + c.replace(/"/g, '&quot;') + '"' + (row.category === c ? ' selected' : '') + '>' + c + '</option>';
        }).join('') +
        '</select></div>';
    });
    html += '</div>';
    var body = document.getElementById('scanBody');
    body.innerHTML = html;
    document.getElementById('scanActions').style.display = 'flex';
    body.querySelectorAll('.scan-check').forEach(function (el) {
      el.addEventListener('change', function () { parsedRows[+el.dataset.idx].include = el.checked; });
    });
    body.querySelectorAll('.scan-desc').forEach(function (el) {
      el.addEventListener('input', function () { parsedRows[+el.dataset.idx].description = el.value; });
    });
    body.querySelectorAll('.scan-amt').forEach(function (el) {
      el.addEventListener('input', function () {
        var v = parseFloat(el.value.replace(',', '.'));
        parsedRows[+el.dataset.idx].amount = isNaN(v) ? 0 : v;
      });
    });
    body.querySelectorAll('.scan-cat').forEach(function (el) {
      el.addEventListener('change', function () { parsedRows[+el.dataset.idx].category = el.value || null; });
    });
  }

  function errorCopy(code) {
    switch (code) {
      case 'image_rejected': return 'That image couldn\u2019t be read \u2014 try a clearer or smaller screenshot.';
      case 'rate_limited': return 'Too many requests right now \u2014 try again in a bit.';
      case 'invalid_json':
      case 'empty_completion':
      case 'refused': return 'Couldn\u2019t make sense of that screenshot. Try a clearer photo, or add the expense manually.';
      case 'session_expired': return 'You\u2019ll need to sign in again to use this.';
      case 'cancelled': return '';
      default: return 'Something went wrong reading that screenshot. Please try again.';
    }
  }

  async function handleScanFile(file) {
    if (!file) return;
    showScanStatus('Reading screenshot\u2026');
    var prompt = 'This image is a screenshot of a bank or payments app showing a list of transactions, in Swedish kronor (SEK). ' +
      'Extract every purchase AND refund/return (ignore salary, transfers-in, and top-ups). ' +
      'Reply with ONLY a JSON array, one object per transaction: {"amount": number (in SEK, no currency symbol; POSITIVE for a purchase, NEGATIVE for a refund or money returned), ' +
      '"description": string (short merchant or purpose, as shown), "date": string in YYYY-MM-DD format if a date is visible for that transaction, otherwise null}. ' +
      'If nothing qualifies, reply with an empty array [].';
    try {
      var result = await sampleFn.json(prompt, { images: file, modelTier: 'default' });
      if (!Array.isArray(result)) result = [];
      parsedRows = result
        .filter(function (r) { return r && typeof r.amount === 'number' && r.amount !== 0; })
        .map(function (r) {
          var d = (typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) ? r.date : todayKey();
          return {
            amount: Math.round(r.amount * 100) / 100,
            description: typeof r.description === 'string' && r.description.trim() ? r.description.trim() : '(no description)',
            date: d, category: null, include: true
          };
        });
      flagDuplicates();
      renderParsedRows();
    } catch (e) {
      var msg = errorCopy(e && e.code);
      if (msg) showScanError(msg); else closePanel();
    }
  }

  scanFile.addEventListener('change', function () {
    var file = scanFile.files && scanFile.files[0];
    handleScanFile(file);
    scanFile.value = '';
  });

  document.getElementById('openAdd').addEventListener('click', function () { openAddPanel(); });
  document.getElementById('openSettings').addEventListener('click', openSettingsPanel);
  document.getElementById('openAnalysis').addEventListener('click', function () {
    state.view = state.view === 'analysis' ? 'history' : 'analysis';
    closePanel();
    render();
  });
  document.getElementById('streakBadge').addEventListener('click', function () {
    var streak = computeStreak();
    var label = streak + (streak === 1 ? ' dags streak' : ' dagars streak');
    var sub = streak > 0 ? 'Fortsätt så!' : 'Logga en dag under budget för att starta en ny streak.';
    openCapybaraLightbox('plain', label, sub, streak === 0);
  });
  document.getElementById('capybaraLightbox').addEventListener('click', function () { this.hidden = true; });

  async function initScanning() {
    try {
      var claudeHost = window.claude;
      if (!claudeHost || typeof claudeHost.use !== 'function') return;
      var s = await claudeHost.use('sample');
      if (!s) return;
      var limits = await s.limits().catch(function () { return null; });
      if (!limits || !limits.images) return;
      sampleFn = s;
      var existingLink = document.getElementById('openScan');
      if (existingLink) existingLink.style.display = 'flex';
    } catch (e) { /* scanning stays hidden */ }
  }

  // --- init ---
  loadState();
  render();
  if (state.allowance === null || isNaN(state.allowance)) {
    setTimeout(openSettingsPanel, 300);
  }
  initScanning();
  handleOneDriveRedirect().then(function (handledRedirect) {
    if (!handledRedirect) syncOneDrive();
  });
  setInterval(function () {
    if (document.visibilityState === 'visible') syncOneDrive();
  }, 120000);
})();
</script>
