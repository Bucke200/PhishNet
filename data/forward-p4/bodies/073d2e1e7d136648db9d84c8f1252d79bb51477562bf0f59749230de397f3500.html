<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE8DC;
    --surface: #E4DDCB;
    --surface-2: #DCD4BF;
    --ink: #2A2620;
    --ink-soft: #6B6250;
    --ink-faint: #8E846E;
    --accent: #96721C;
    --good: #4B6B45;
    --over: #8C3B32;
    --hairline: rgba(42, 38, 32, 0.14);
    --shadow: rgba(42, 38, 32, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1917;
      --surface: #242220;
      --surface-2: #2C2A26;
      --ink: #EDE6D8;
      --ink-soft: #A69C89;
      --ink-faint: #7A7263;
      --accent: #C9A227;
      --good: #7FA36E;
      --over: #C06256;
      --hairline: rgba(237, 230, 216, 0.12);
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1917;
    --surface: #242220;
    --surface-2: #2C2A26;
    --ink: #EDE6D8;
    --ink-soft: #A69C89;
    --ink-faint: #7A7263;
    --accent: #C9A227;
    --good: #7FA36E;
    --over: #C06256;
    --hairline: rgba(237, 230, 216, 0.12);
    --shadow: rgba(0, 0, 0, 0.4);
  }

  /* ---- Seasonal themes (auto-applied by date, see applySeasonTheme) ---- */
  :root[data-season="halloween"] {
    --bg: #33200F;
    --surface: #3D2814;
    --surface-2: #4A311C;
    --ink: #F7E9D7;
    --ink-soft: #D3AE83;
    --ink-faint: #A98A61;
    --accent: #E8730A;
    --good: #9CBB6B;
    --over: #D9694C;
    --hairline: rgba(247, 233, 215, 0.14);
    --shadow: rgba(20, 10, 5, 0.4);
  }
  :root[data-season="december"] {
    --bg: #FAF6F0;
    --surface: #F3ECE3;
    --surface-2: #EDE2D6;
    --ink: #2A2620;
    --ink-soft: #8A7A6E;
    --ink-faint: #A99C8D;
    --accent: #C0392B;
    --good: #2F6E4F;
    --over: #942F22;
    --hairline: rgba(42, 38, 32, 0.12);
    --shadow: rgba(120, 100, 80, 0.18);
  }
  :root[data-season="summer"] {
    --bg: #FFF3D6;
    --surface: #FCEAC2;
    --surface-2: #F7DFA8;
    --ink: #3A2A12;
    --ink-soft: #7A5B2E;
    --ink-faint: #9C8055;
    --accent: #FF6F3C;
    --good: #2F8F79;
    --over: #C0392B;
    --hairline: rgba(58, 42, 18, 0.12);
    --shadow: rgba(90, 60, 10, 0.22);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100%;
  }
  body { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  .page {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    z-index: 0;
  }

  /* ---- Seasonal decoration: a subtle glow + scattered accents behind
     the header/hero, negative z-index so it never sits above content ---- */
  :root[data-season="halloween"] .page::before,
  :root[data-season="halloween"] .page::after,
  :root[data-season="december"] .page::before,
  :root[data-season="december"] .page::after {
    content: '';
    position: absolute;
    z-index: -1;
    pointer-events: none;
  }
  :root[data-season="halloween"] .page::before {
    top: 0; left: 0; right: 0; height: 230px;
    background:
      radial-gradient(circle at 82% 8%, rgba(232, 115, 10, 0.5) 0 4px, transparent 5px),
      radial-gradient(circle at 66% 24%, rgba(201, 138, 58, 0.45) 0 3px, transparent 4px),
      radial-gradient(circle at 12% 18%, rgba(232, 115, 10, 0.35) 0 3px, transparent 4px),
      radial-gradient(circle at 30% 42%, rgba(160, 110, 40, 0.35) 0 3px, transparent 4px),
      radial-gradient(circle at 90% 48%, rgba(232, 115, 10, 0.3) 0 3px, transparent 4px),
      radial-gradient(circle at 78% 12%, rgba(232, 115, 10, 0.35), transparent 48%);
  }
  :root[data-season="halloween"] .page::after {
    top: 64px; right: 20px; width: 34px; height: 27px;
    background:
      radial-gradient(ellipse 2.5px 5px at 50% 10%, #4E3418 0%, #4E3418 85%, transparent 86%),
      radial-gradient(ellipse 16px 12px at 50% 62%, #F09030 0%, #E8730A 65%, transparent 66%);
  }
  :root[data-season="december"] .page::before {
    top: 0; left: 0; right: 0; height: 230px;
    background:
      radial-gradient(circle at 50% 4%, rgba(192, 57, 43, 0.12), transparent 42%),
      radial-gradient(circle at 14% 14%, #C0392B 0 2.5px, transparent 3.5px),
      radial-gradient(ellipse 2px 3px at 17% 10%, #2F6E4F 0%, #2F6E4F 85%, transparent 86%),
      radial-gradient(circle at 82% 30%, #C0392B 0 2.5px, transparent 3.5px),
      radial-gradient(ellipse 2px 3px at 85% 26%, #2F6E4F 0%, #2F6E4F 85%, transparent 86%),
      radial-gradient(circle at 60% 12%, #C0392B 0 2px, transparent 3px);
  }
  :root[data-season="december"] .page::after {
    top: 64px; left: 18px; right: 18px; height: 1px;
    background: repeating-linear-gradient(90deg, #C0392B 0 8px, #2F6E4F 8px 16px, transparent 16px 20px);
  }

  /* ---- Header ---- */
  header {
    padding: max(20px, env(safe-area-inset-top)) 20px 4px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .date-label { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; margin: 0; }
  .header-actions { display: flex; gap: 6px; margin: -6px -6px 0 0; }
  .icon-btn {
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    color: var(--ink-soft);
    border-radius: 8px;
    display: flex;
  }
  .icon-btn:active { background: var(--hairline); }
  .icon-btn svg { width: 20px; height: 20px; display: block; }
  .icon-btn.primary { color: var(--accent); }

  /* ---- Panel (replaces the old bottom sheets — sits in normal flow, always reachable) ---- */
  .panel {
    margin: 0 20px 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 16px 16px 14px;
  }
  .panel[hidden] { display: none; }
  .panel h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 14px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 17px;
    color: var(--ink);
    font-family: inherit;
  }
  .field input.mono-input { font-family: 'IBM Plex Mono', monospace; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
  .diag-divider { border-top: 1px solid var(--hairline); margin: 16px 0 14px; }
  .diag-block p.hint { font-size: 12.5px; line-height: 1.5; }

  .panel-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--ink-soft); }
  .btn:active { opacity: 0.8; }

  .scan-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    background: none;
    border: none;
    padding: 12px 0 2px;
    margin-top: 4px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .scan-link svg { width: 15px; height: 15px; }
  .scan-link:active { opacity: 0.7; }

  .scan-intro { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 14px; }
  .scan-upload {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px dashed var(--ink-faint);
    border-radius: 12px;
    padding: 22px 14px;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
  }
  .scan-upload svg { width: 18px; height: 18px; }
  .scan-status { font-size: 14px; color: var(--ink-soft); text-align: center; padding: 14px 0; }
  .scan-rows { max-height: 44vh; overflow-y: auto; margin: 4px 0 14px; }
  .scan-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
  .scan-row:last-child { border-bottom: none; }
  .scan-row input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent); }
  .scan-row .scan-desc {
    flex: 1; min-width: 0;
    background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .scan-row .scan-amt {
    width: 80px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-family: 'IBM Plex Mono', monospace; color: var(--ink); text-align: right;
  }
  .scan-error { font-size: 13px; color: var(--over); margin: 0 0 12px; }

  .import-textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
    resize: vertical;
    min-height: 110px;
  }
  .import-textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .type-toggle { display: flex; gap: 8px; }
  .type-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--hairline);
    background: var(--surface-2);
    color: var(--ink-soft);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .type-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .dup-warning {
    font-size: 13px;
    color: var(--over);
    background: color-mix(in srgb, var(--over) 12%, transparent);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0 0 12px;
    line-height: 1.4;
  }

  .entry-amount.refund { color: var(--good); }

  .scan-row.scan-row-dup { background: color-mix(in srgb, var(--over) 8%, transparent); border-radius: 8px; }
  .dup-note { font-size: 12px; color: var(--over); padding: 0 0 9px 28px; margin-top: -5px; }

  /* ---- Hero ---- */
  .hero { padding: 4px 20px 20px; border-bottom: 1px solid var(--hairline); }
  .hero-amount {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .hero-sub { margin: 6px 0 0; font-size: 15px; font-weight: 500; }
  .hero-sub.good { color: var(--good); }
  .hero-sub.over { color: var(--over); }
  .hero-sub.neutral { color: var(--ink-faint); }

  /* ---- History ---- */
  .history { padding: 8px 20px 60px; }
  .day-group { margin-top: 22px; }
  .day-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 8px; border-bottom: 1px solid var(--hairline); margin-bottom: 2px;
  }
  .day-name { font-size: 14px; font-weight: 500; color: var(--ink-soft); }
  .day-diff {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500;
    padding: 2px 8px; border-radius: 20px;
  }
  .day-diff.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .day-diff.over { color: var(--over); background: color-mix(in srgb, var(--over) 14%, transparent); }

  .entry-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); cursor: pointer; }
  .entry-row:active { background: var(--surface); }
  .entry-row:last-child { border-bottom: none; }
  .entry-desc { flex: 1; font-size: 15px; min-width: 0; overflow-wrap: break-word; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .entry-del { background: none; border: none; padding: 4px; color: var(--ink-faint); opacity: 0.55; cursor: pointer; flex-shrink: 0; }
  .entry-del:active { opacity: 1; }
  .entry-del svg { width: 15px; height: 15px; display: block; }

  .empty-state { margin-top: 40px; text-align: center; color: var(--ink-faint); font-size: 14px; line-height: 1.5; padding: 0 30px; }

  /* ---- Analysis ---- */
  .analysis { padding: 8px 20px 60px; }
  .period-nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 4px; }
  .period-nav .icon-btn { padding: 6px 10px; font-size: 20px; line-height: 1; }
  .period-label { font-size: 14px; font-weight: 500; color: var(--ink-soft); text-align: center; flex: 1; }

  .cat-breakdown { margin-top: 6px; }
  .cat-row { padding: 12px 0; border-bottom: 1px solid var(--hairline); cursor: pointer; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
  .cat-name { font-size: 15px; }
  .cat-amt { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .cat-bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }

  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-chip {
    padding: 8px 12px; border-radius: 20px; border: 1px solid var(--hairline);
    background: var(--surface-2); color: var(--ink-soft); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .cat-chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .cat-manage-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .cat-manage-input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .cat-manage-del { background: none; border: none; color: var(--ink-faint); font-size: 20px; line-height: 1; padding: 4px 8px; cursor: pointer; }
  .cat-add-row { display: flex; gap: 8px; margin-top: 4px; }
  .cat-add-row input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; color: var(--ink); font-family: inherit;
  }

  .scan-row-cat { padding: 0 0 9px 28px; margin-top: -5px; }
  .scan-row-cat select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 6px 8px; font-size: 13px; color: var(--ink); font-family: inherit;
  }
  .version-line { font-size: 12px; color: var(--ink-faint); text-align: center; margin: 18px 0 0; }

  /* ---- Streak, savings goal, badges ---- */
  .streak-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 4px 10px; border-radius: 20px; background: var(--surface-2); color: var(--ink-soft);
    font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: inherit;
  }
  .streak-badge .capybara-icon { flex-shrink: 0; }

  .goal-block { margin: 4px 0 18px; }
  .cat-bar-fill.over { background: var(--over); }

  .bucket-row { display: flex; gap: 12px; }
  .bucket-card {
    flex: 1; background: var(--surface-2); border-radius: 12px; padding: 12px 14px;
  }
  .bucket-card-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .bucket-card-amt { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; margin-bottom: 6px; }
  .bucket-card-amt.good { color: var(--good); }
  .bucket-card-amt.over { color: var(--over); }

  .entry-bucket-tag {
    display: inline-block; font-size: 10px; font-weight: 500; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
  }

  .bucket-cashout-row { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .bucket-cashout-row:last-child { border-bottom: none; }
  .cashout-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .cashout-desc { font-size: 14px; }
  .cashout-amt { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }

  .badge-row { display: flex; gap: 12px; }
  .badge-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.3; cursor: pointer;
  }
  .badge-item.badge-locked { opacity: 0.32; }

  @keyframes capybara-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(-1.5deg); }
  }
  .capybara-animated { animation: capybara-bob 2.4s ease-in-out infinite; }

  .capybara-lightbox {
    position: fixed; inset: 0; background: rgba(20, 17, 12, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px;
  }
  .capybara-lightbox[hidden] { display: none; }
  .capybara-lightbox-card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
    padding: 28px 26px 22px; text-align: center; max-width: 280px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35);
  }
  .capybara-lightbox-card svg { width: 200px; height: auto; }
  .capybara-lightbox-card p { margin: 14px 0 0; font-size: 16px; font-weight: 600; color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; }
  .capybara-lightbox-card p.hint { margin-top: 6px; font-size: 13px; font-weight: 400; font-family: inherit; }
</style>
</head>
<body>
<div class="page">

  <header>
    <p class="date-label" id="todayLabel">—</p>
    <div class="header-actions">
      <button class="icon-btn" id="openAnalysis" aria-label="Analysis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V5m5 14V9m5 10V13m5 6V7"/></svg>
      </button>
      <button class="icon-btn primary" id="openAdd" aria-label="Add expense">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="panel" id="panel" hidden></section>

  <div id="historyView">
    <div class="hero">
      <p class="hero-amount mono" id="heroAmount">0,00 kr</p>
      <p class="hero-sub neutral" id="heroSub">Set your daily allowance to get started</p>
      <div class="streak-badge" id="streakBadge" hidden></div>
    </div>

    <div class="history" id="history"></div>
  </div>

  <div class="analysis" id="analysisView" hidden></div>
</div>
<div class="capybara-lightbox" id="capybaraLightbox" hidden></div>
<input type="file" id="scanFile" accept="image/*" style="display:none;">

<script>
(function () {
  var STORE_KEY = 'ledger.entries.v1';
  var ALLOWANCE_KEY = 'ledger.allowance.v1';
  var LAST_SAVED_KEY = 'ledger.lastSaved.v1';
  var CATEGORIES_KEY = 'ledger.categories.v1';
  var MONTH_START_KEY = 'ledger.monthStartDay.v1';
  var BUCKETS_KEY = 'ledger.buckets.v1';
  var BADGES_KEY = 'ledger.badges.v1';
  var DELETED_IDS_KEY = 'ledger.deletedIds.v1';
  var ONEDRIVE_KEY = 'ledger.onedrive.v1';
  var CATEGORY_MIGRATION_KEY = 'ledger.categoriesMigrationV2.v1';
  var NEW_CATEGORIES_V2 = ['Take-away', 'Fika', 'Kläder'];

  function saveOneDriveConfig() {
    try {
      localStorage.setItem(ONEDRIVE_KEY, JSON.stringify({
        clientId: oneDrive.clientId,
        refreshToken: oneDrive.refreshToken,

  // ---------------------------------------------------------------
  // Sharing with OneDrive: a "Ledger" folder in one person's OneDrive
  // holds entries.json; the other person accesses it via a normal
  // OneDrive share invite. No backend — the app talks to Microsoft's
  // login and Graph API directly using OAuth 2.0 + PKCE (a public
  // client flow that needs no server-held secret), scoped to personal
  // Microsoft accounts only ("consumers"). Since OneDrive is file-based
  // rather than a real database, entries carry an `updatedAt` stamp and
  // deletions are tracked as tombstones so two devices merge safely
  // instead of overwriting each other's changes.
  // ---------------------------------------------------------------
  var ONEDRIVE_AUTHORITY = 'https://login.microsoftonline.com/consumers';
  var ONEDRIVE_SCOPES = 'Files.ReadWrite offline_access User.Read';
  var GRAPH_BASE = 'https://graph.microsoft.com/v1.0';
  var TOMBSTONE_MAX_AGE_MS = 180 * 86400000;
  var syncDebounceTimer = null;

  function oneDriveRedirectUri() { return window.location.origin + window.location.pathname; }

  function base64UrlEncode(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function randomString(len) {
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return base64UrlEncode(arr.buffer).slice(0, len);
  }

  async function pkceChallengeFromVerifier(verifier) {
    var data = new TextEncoder().encode(verifier);
    var digest = await crypto.subtle.digest('SHA-256', data);
    return base64UrlEncode(digest);
  }

  async function startOneDriveLogin() {
    if (!oneDrive.clientId) return;
    var verifier = randomString(64);
    var challenge = await pkceChallengeFromVerifier(verifier);
    var loginState = randomString(24);
    try {
      sessionStorage.setItem('ledger.onedrive.pkce', verifier);
      sessionStorage.setItem('ledger.onedrive.state', loginState);
    } catch (e) {}
    var params = new URLSearchParams({
      client_id: oneDrive.clientId,
      response_type: 'code',
      redirect_uri: oneDriveRedirectUri(),
      response_mode: 'query',
      scope: ONEDRIVE_SCOPES,
      code_challenge: challenge,
      code_challenge_method: 'S256',
      state: loginState
    });
    window.location.assign(ONEDRIVE_AUTHORITY + '/oauth2/v2.0/authorize?' + params.toString());
  }

  function applyTokenResponse(json) {
    oneDrive.accessToken = json.access_token;
    oneDrive.accessTokenExpiry = Date.now() + (json.expires_in ? json.expires_in * 1000 : 0) - 60000;
    if (json.refresh_token) oneDrive.refreshToken = json.refresh_token;
  }

  async function handleOneDriveRedirect() {
    var url = new URL(window.location.href);
    var code = url.searchParams.get('code');
    var returnedState = url.searchParams.get('state');
    var authError = url.searchParams.get('error');
    if (!code && !authError) return false;
    url.searchParams.delete('code');
    url.searchParams.delete('state');
    url.searchParams.delete('session_state');
    url.searchParams.delete('error');
    url.searchParams.delete('error_description');
    var qs = url.searchParams.toString();
    window.history.replaceState({}, document.title, url.pathname + (qs ? '?' + qs : ''));
    if (authError) { oneDrive.lastError = authError; return true; }
    var expectedState = sessionStorage.getItem('ledger.onedrive.state');
    var verifier = sessionStorage.getItem('ledger.onedrive.pkce');
    try {
      sessionStorage.removeItem('ledger.onedrive.state');
      sessionStorage.removeItem('ledger.onedrive.pkce');
    } catch (e) {}
    if (!verifier || returnedState !== expectedState) { oneDrive.lastError = 'state_mismatch'; return true; }
    try {
      var body = new URLSearchParams({
        client_id: oneDrive.clientId,
        scope: ONEDRIVE_SCOPES,
        code: code,
        redirect_uri: oneDriveRedirectUri(),
        grant_type: 'authorization_code',
        code_verifier: verifier
      });
      var res = await fetch(ONEDRIVE_AUTHORITY + '/oauth2/v2.0/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
      var json = await res.json();
      if (!res.ok) { oneDrive.lastError = json.error || 'token_error'; return true; }
      applyTokenResponse(json);
      saveOneDriveConfig();
      await fetchAccountLabel();
      saveOneDriveConfig();
      await syncOneDrive();
    } catch (e) { oneDrive.lastError = 'network'; }
    return true;
  }

  async function getOneDriveAccessToken() {
    if (oneDrive.accessToken && Date.now() < oneDrive.accessTokenExpiry) return oneDrive.accessToken;
    if (!oneDrive.refreshToken || !oneDrive.clientId) return null;
    try {
      var body = new URLSearchParams({
        client_id: oneDrive.clientId,
        scope: ONEDRIVE_SCOPES,
        refresh_token: oneDrive.refreshToken,
        grant_type: 'refresh_token'
      });
      var res = await fetch(ONEDRIVE_AUTHORITY + '/oauth2/v2.0/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
      var json = await res.json();
      if (!res.ok) {
        oneDrive.lastError = json.error || 'refresh_error';
        oneDrive.refreshToken = null;
        saveOneDriveConfig();
        return null;
      }
      applyTokenResponse(json);
      saveOneDriveConfig();
      return oneDrive.accessToken;
    } catch (e) { oneDrive.lastError = 'network'; return null; }
  }

  function graphFetch(path, token, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {}, { Authorization: 'Bearer ' + token });
    return fetch(GRAPH_BASE + path, Object.assign({}, options, { headers: headers }));
  }

  async function fetchAccountLabel() {
    var token = await getOneDriveAccessToken();
    if (!token) return;
    try {
      var res = await graphFetch('/me', token);
      if (res.ok) {
        var me = await res.json();
        oneDrive.accountLabel = me.mail || me.userPrincipalName || null;
      }
    } catch (e) {}
  }

  // Finds (or creates) the shared "Ledger" folder: first checks your own
  // OneDrive, then folders others have shared with you, and only creates
  // a new one if neither exists yet.
  async function resolveLedgerLocation(token) {
    if (oneDrive.remoteRef) return oneDrive.remoteRef;
    var own = await graphFetch('/me/drive/root:/Ledger', token);
    if (own.ok) {
      var ownJson = await own.json();
      return { driveId: ownJson.parentReference.driveId, folderId: ownJson.id, mode: 'own' };
    }
    var sharedRes = await graphFetch('/me/drive/sharedWithMe', token);
    if (sharedRes.ok) {
      var sharedJson = await sharedRes.json();
      var match = (sharedJson.value || []).find(function (item) {
        return item.remoteItem && item.remoteItem.name === 'Ledger' && item.remoteItem.folder;
      });
      if (match) {
        return { driveId: match.remoteItem.parentReference.driveId, folderId: match.remoteItem.id, mode: 'shared' };
      }
    }
    var createRes = await graphFetch('/me/drive/root/children', token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'Ledger', folder: {}, '@microsoft.graph.conflictBehavior': 'fail' })
    });
    if (createRes.ok) {
      var createdJson = await createRes.json();
      return { driveId: createdJson.parentReference.driveId, folderId: createdJson.id, mode: 'own' };
    }
    throw new Error('resolve_failed');
  }

  async function downloadLedgerFile(token, ref) {
    var res = await graphFetch('/drives/' + ref.driveId + '/items/' + ref.folderId + ':/entries.json:/content', token);
    if (res.status === 404) return { data: null, etag: null };
    if (!res.ok) throw new Error('download_failed_' + res.status);
    var etag = res.headers.get('ETag');
    var json = await res.json();
    return { data: json, etag: etag };
  }

  async function uploadLedgerFile(token, ref, payload, ifMatchEtag) {
    var headers = { 'Content-Type': 'application/json' };
    if (ifMatchEtag) headers['if-match'] = ifMatchEtag;
    var res = await graphFetch('/drives/' + ref.driveId + '/items/' + ref.folderId + ':/entries.json:/content', token, {
      method: 'PUT', headers: headers, body: JSON.stringify(payload)
    });
    if (res.status === 412) return { conflict: true };
    if (!res.ok) throw new Error('upload_failed_' + res.status);
    var json = await res.json();
    return { conflict: false, etag: json.eTag || null };
  }

  async function shareLedgerWith(email) {
    var statusEl = document.getElementById('oneDriveShareStatus');
    if (statusEl) statusEl.textContent = 'Sending invite…';
    try {
      var token = await getOneDriveAccessToken();
      if (!token || !oneDrive.remoteRef) throw new Error('not_ready');
      var res = await graphFetch('/drives/' + oneDrive.remoteRef.driveId + '/items/' + oneDrive.remoteRef.folderId + '/invite', token, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recipients: [{ email: email }],
          message: 'Delar Ledger med dig så vi ser samma utgifter.',
          requireSignIn: true, sendInvitation: true, roles: ['write']
        })
      });
      if (!res.ok) throw new Error('invite_failed_' + res.status);
      if (statusEl) statusEl.textContent = 'Invite sent to ' + email + '.';
    } catch (e) {
      if (statusEl) statusEl.textContent = 'Could not send invite (' + (e && e.message) + ').';
    }
  }

  // Union-merge by entry id, newest `updatedAt`/`ts` wins; a tombstone
  // (from either side) removes an entry unless it was edited again after
  // the deletion. Pure function so it's easy to test without a network.
  function mergeLedgerData(localEntries, localDeleted, remoteEntries, remoteDeleted) {
    var deletedMap = {};
    (localDeleted || []).concat(remoteDeleted || []).forEach(function (d) {
      if (!deletedMap[d.id] || d.deletedAt > deletedMap[d.id]) deletedMap[d.id] = d.deletedAt;
    });
    var byId = {};
    (localEntries || []).concat(remoteEntries || []).forEach(function (e) {
      var stamp = e.updatedAt || e.ts || 0;
      var existing = byId[e.id];
      var existingStamp = existing ? (existing.updatedAt || existing.ts || 0) : -1;
      if (!existing || stamp > existingStamp) byId[e.id] = e;
    });
    var cutoff = Date.now() - TOMBSTONE_MAX_AGE_MS;
    var entries = Object.keys(byId).map(function (id) { return byId[id]; }).filter(function (e) {
      var d = deletedMap[e.id];
      return !d || d < (e.updatedAt || e.ts || 0);
    });
    var deletedIds = Object.keys(deletedMap)
      .filter(function (id) { return deletedMap[id] > cutoff; })
      .map(function (id) { return { id: id, deletedAt: deletedMap[id] }; });
    return { entries: entries, deletedIds: deletedIds };
  }

  function oneDriveStatusText() {
    var lines = [oneDrive.accountLabel ? 'Signed in as ' + oneDrive.accountLabel : 'Signed in'];
    lines.push(oneDrive.syncing ? 'Syncing…' : (oneDrive.lastSyncedAt ? 'Last synced ' + formatTimestamp(oneDrive.lastSyncedAt) : 'Not synced yet'));
    if (oneDrive.lastError) lines.push('Last error: ' + oneDrive.lastError);
    return lines.join(' · ');
  }

  function renderOneDriveStatus() {
    var el = document.getElementById('oneDriveStatus');
    if (el) el.textContent = oneDriveStatusText();
  }

  function scheduleSync() {
    if (!oneDrive.clientId || !oneDrive.refreshToken) return;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(function () { syncOneDrive(); }, 1500);
  }

  async function syncOneDrive() {
    if (!oneDrive.clientId || !oneDrive.refreshToken || oneDrive.syncing) return;
    oneDrive.syncing = true;
    renderOneDriveStatus();
    try {
      var token = await getOneDriveAccessToken();
      if (!token) throw new Error('no_token');
      var ref = oneDrive.remoteRef || await resolveLedgerLocation(token);
      oneDrive.remoteRef = ref;
      for (var attempt = 0; attempt < 3; attempt++) {
        var remote = await downloadLedgerFile(token, ref);
        var remoteData = remote.data || { entries: [], deletedIds: [] };
        var merged = mergeLedgerData(state.entries, state.deletedIds, remoteData.entries, remoteData.deletedIds);
        state.entries = merged.entries;
        state.deletedIds = merged.deletedIds;
        saveEntries();
        saveDeletedIds();
        var result = await uploadLedgerFile(token, ref, { entries: state.entries, deletedIds: state.deletedIds }, remote.etag);
        if (!result.conflict) { oneDrive.lastEtag = result.etag; break; }
      }
      oneDrive.lastSyncedAt = Date.now();
      oneDrive.lastError = null;
      saveOneDriveConfig();
      render();
    } catch (e) {
      oneDrive.lastError = (e && e.message) || 'sync_failed';
    } finally {
      oneDrive.syncing = false;
      renderOneDriveStatus();
    }
  }

  function dayKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function todayKey() { return dayKey(new Date()); }

  function formatMoney(n) {
    var sign = n < 0 ? '-' : '';
    var abs = Math.abs(n).toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return sign + abs + ' kr';
  }

  function dayLabel(key) {
    var today = todayKey();
    var d = new Date(key + 'T00:00:00');
    var yest = new Date();
    yest.setDate(yest.getDate() - 1);
    if (key === today) return 'Today';
    if (key === dayKey(yest)) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function headerLabel() {
    return new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  // ---------------------------------------------------------------
  // Seasonal visual themes: a different color palette auto-applied
  // by date, no manual override. Halloween runs mid-October through
  // Nov 5 (covers Allhelgona too); December and Summer (July) cover
  // their full calendar months.
  // ---------------------------------------------------------------
  function getSeasonTheme(date) {
    var m = date.getMonth() + 1, d = date.getDate();
    if ((m === 10 && d >= 15) || (m === 11 && d <= 5)) return 'halloween';
    if (m === 12) return 'december';
    if (m === 7) return 'summer';
    return null;
  }

  function applySeasonTheme() {
    var season = getSeasonTheme(new Date());
    if (season) document.documentElement.setAttribute('data-season', season);
    else document.documentElement.removeAttribute('data-season');
  }

    { month: 12, day: 31, emoji: '🎆', name: 'Nyårsafton' }
  ];

  var FIXED_RANGE_HOLIDAYS = [
    { startMonth: 4, startDay: 13, endMonth: 4, endDay: 15, emoji: '💦', name: 'Songkran' },
    { startMonth: 6, startDay: 19, endMonth: 6, endDay: 25, emoji: '🌼', name: 'Midsommar' },
    { startMonth: 12, startDay: 25, endMonth: 12, endDay: 26, emoji: '🎁', name: 'Jul- och annandag' }
  ];

  // Best-effort estimates — double-check against an official Thai calendar.
  var LUNAR_HOLIDAYS = {
    2024: { makha: '2024-02-24', visakha: '2024-05-22', loy: '2024-11-15' },
    2025: { makha: '2025-02-12', visakha: '2025-05-11', loy: '2025-11-05' },
    2026: { makha: '2026-03-03', visakha: '2026-05-30', loy: '2026-11-24' },
    2027: { makha: '2027-02-21', visakha: '2027-05-20', loy: '2027-11-14' },
    2028: { makha: '2028-02-10', visakha: '2028-05-08', loy: '2028-11-02' }
  };

  function computeEaster(year) {
    var a = year % 19, b = Math.floor(year / 100), c = year % 100;
    var d = Math.floor(b / 4), e = b % 4;
    var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    var h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4;
    var l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var month = Math.floor((h + l - 7 * m + 114) / 31);
    var day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }

  function adventSundays(year) {
    var dec24 = new Date(year, 11, 24);
    var fourth = new Date(dec24);
    fourth.setDate(dec24.getDate() - dec24.getDay());
    var sundays = [];
    for (var i = 0; i < 4; i++) {
      var d = new Date(fourth);
      d.setDate(fourth.getDate() - (3 - i) * 7);
      sundays.push(d);
    }
    return sundays;
  }

  function getHolidaysForDate(date) {
    var year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate();
    var key = dayKey(date);
    var matches = [];

    FIXED_HOLIDAYS.forEach(function (h) {
      if (h.month === month && h.day === day) matches.push({ emoji: h.emoji, name: h.name });
    });

    FIXED_RANGE_HOLIDAYS.forEach(function (h) {
      var start = new Date(year, h.startMonth - 1, h.startDay);
      var end = new Date(year, h.endMonth - 1, h.endDay);
      if (date >= start && date <= end) matches.push({ emoji: h.emoji, name: h.name });
    });

    var easter = computeEaster(year);
    if (dayKey(easter) === key) matches.push({ emoji: '🐣', name: 'Påsk' });
    var ascension = new Date(easter); ascension.setDate(easter.getDate() + 39);
    if (dayKey(ascension) === key) matches.push({ emoji: '🕊️', name: 'Kristi himmelsfärd' });
    var pentecost = new Date(easter); pentecost.setDate(easter.getDate() + 49);
    if (dayKey(pentecost) === key) matches.push({ emoji: '🕊️', name: 'Pingst' });

    adventSundays(year).forEach(function (d, idx) {
      if (dayKey(d) === key) {
        var labels = ['Första', 'Andra', 'Tredje', 'Fjärde'];
        matches.push({ emoji: '🕯️', name: labels[idx] + ' advent' });
      }
    });

    var lunar = LUNAR_HOLIDAYS[year];
    if (lunar) {
      if (lunar.makha === key) matches.push({ emoji: '🪷', name: 'Makha Bucha' });
      if (lunar.visakha === key) matches.push({ emoji: '🪷', name: 'Visakha Bucha' });
      if (lunar.loy === key) matches.push({ emoji: '🏮', name: 'Loy Krathong' });
    }

    if (day === 13 && date.getDay() === 5) matches.push({ icon: 'hockeyMask', name: 'Fredagen den 13:e' });

    return matches;
  }

  // No emoji for a hockey mask exists, so Friday the 13th gets a small
  // custom inline icon instead of the usual emoji.
  function hockeyMaskSvg(size) {
    size = size || 14;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="vertical-align:-2px;">' +
      '<path d="M12 2C6 2 3 6 3 11c0 6 4 10 9 10s9-4 9-10c0-5-3-9-9-9Z" fill="#EDE6D8" stroke="#8B7E68" stroke-width="0.8"/>' +
      '<ellipse cx="8.3" cy="10.5" rx="1.6" ry="2.2" fill="#2A2620"/>' +
      '<ellipse cx="15.7" cy="10.5" rx="1.6" ry="2.2" fill="#2A2620"/>' +
      '<path d="M12 12.5 L10.3 16 L13.7 16 Z" fill="#2A2620"/>' +
      '<path d="M4.5 8 L9 13" stroke="#B23A2E" stroke-width="1.4" stroke-linecap="round"/>' +
      '<path d="M15 6 L20 12" stroke="#B23A2E" stroke-width="1.4" stroke-linecap="round"/>' +
      '<path d="M9 17 L15 20" stroke="#B23A2E" stroke-width="1.4" stroke-linecap="round"/>' +
      '</svg>';
  }

  function holidayLabelSuffix(date) {
    var holidays = getHolidaysForDate(date);
    if (holidays.length === 0) return '';
    return ' ' + holidays.map(function (h) {
      return (h.icon === 'hockeyMask' ? hockeyMaskSvg(14) : h.emoji) + ' ' + h.name;
    }).join(' · ');
  }

  function groupByDay() {
    var groups = {};
    state.entries.forEach(function (e) {
      if (!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });
    var keys = Object.keys(groups).sort().reverse();
    return keys.map(function (k) {
      var items = groups[k].slice().sort(function (a, b) { return b.ts - a.ts; });
      var total = items.filter(function (e) { return !e.bucket; }).reduce(function (sum, e) { return sum + e.amount; }, 0);
      return { date: k, items: items, total: total };
    });
  }

  // ---------------------------------------------------------------
  // Analysis: day/month/year totals with a custom month start day,
  // total-vs-average toggle, and a per-category breakdown with
  // drill-down into that category's transactions.
  // ---------------------------------------------------------------
  function daysInMonth(year, monthIndex0) { return new Date(year, monthIndex0 + 1, 0).getDate(); }

  function periodStartForMonth(year, monthIndex0, startDay) {
    var d = Math.min(startDay, daysInMonth(year, monthIndex0));
    return new Date(year, monthIndex0, d);
  }

  function addMonthsClamped(year, monthIndex0, delta, startDay) {
    var total = monthIndex0 + delta;
    var y = year + Math.floor(total / 12);
    var m = ((total % 12) + 12) % 12;
    return periodStartForMonth(y, m, startDay);
  }

  function getMonthPeriod(anchor, startDay) {
    var y = anchor.getFullYear(), m = anchor.getMonth();
    var thisStart = periodStartForMonth(y, m, startDay);
    var start, end;
    if (anchor.getTime() >= thisStart.getTime()) {
      start = thisStart;
      end = new Date(addMonthsClamped(y, m, 1, startDay).getTime() - 86400000);
    } else {
      start = addMonthsClamped(y, m, -1, startDay);
      end = new Date(thisStart.getTime() - 86400000);
    }
    return { start: start, end: end };
  }

  function getYearPeriod(anchor) {
    var y = anchor.getFullYear();
    return { start: new Date(y, 0, 1), end: new Date(y, 11, 31) };
  }

  function getPeriod(type, anchor, startDay) {
    if (type === 'day') return { start: anchor, end: anchor };
    if (type === 'year') return getYearPeriod(anchor);
    return getMonthPeriod(anchor, startDay);
  }

  function shiftPeriod(period, type, startDay, dir) {
    if (type === 'day') {
      var d = new Date(period.start); d.setDate(d.getDate() + dir); return d;
    }
    if (type === 'year') {
      var y = new Date(period.start); y.setFullYear(y.getFullYear() + dir); return y;
    }
    if (dir < 0) {
      var p = new Date(period.start); p.setDate(p.getDate() - 1); return p;
    }
    var p2 = new Date(period.end); p2.setDate(p2.getDate() + 1); return p2;
  }

  function formatPeriodLabel(type, period) {
    if (type === 'day') {
      return period.start.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
    if (type === 'year') {
      return String(period.start.getFullYear());
    }
    var sameMonth = period.start.getMonth() === period.end.getMonth() && period.start.getFullYear() === period.end.getFullYear();
    if (sameMonth) {
      return period.start.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    }
    return period.start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
      ' – ' + period.end.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function entriesInPeriod(period) {
    var sk = dayKey(period.start), ek = dayKey(period.end);
    return state.entries.filter(function (e) { return e.date >= sk && e.date <= ek; });
  }

  function periodTotal(items) { return items.reduce(function (sum, e) { return sum + e.amount; }, 0); }

  function categoryBreakdown(items) {
    var map = {};
    items.forEach(function (e) {
      var cat = e.category || UNCATEGORIZED;
      map[cat] = (map[cat] || 0) + e.amount;
    });
    return Object.keys(map).map(function (c) { return { category: c, total: map[c] }; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  function capybaraSvg(variant, size, animated) {
    size = size || 18;
    var eyeArea = '<circle cx="82" cy="27" r="2.4" fill="#2A2620"/><circle cx="82.9" cy="26.1" r="0.8" fill="#fff"/>';
    var extra = '';
    if (variant === 'sunglasses') {
      eyeArea = '';
      extra = '<ellipse cx="82" cy="27" rx="9.5" ry="5.6" fill="#2A2620"/>' +
        '<rect x="72.5" y="25.6" width="4" height="2" fill="#2A2620"/>' +
        '<ellipse cx="78.5" cy="24.5" rx="1.6" ry="1" fill="#EDE6D8" opacity="0.5"/>' +
        '<ellipse cx="85.5" cy="24.5" rx="1.6" ry="1" fill="#EDE6D8" opacity="0.5"/>';
    } else if (variant === 'crown') {
      extra = '<path d="M62 10 L66 1.5 L71.5 9 L77 0.5 L82.5 9 L88 1.5 L92 10 L90.5 15 L63.5 15 Z" fill="#D4A017" stroke="#9C7A12" stroke-width="0.8" stroke-linejoin="round"/>' +
        '<circle cx="66" cy="3.5" r="1.6" fill="#F2C94C"/><circle cx="77" cy="2.5" r="1.6" fill="#F2C94C"/><circle cx="88" cy="3.5" r="1.6" fill="#F2C94C"/>';
    }
    return '<svg class="capybara-icon' + (animated ? ' capybara-animated' : '') + '" width="' + size + '" height="' + Math.round(size * 0.7) + '" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="50" cy="63" rx="38" ry="4.5" fill="rgba(0,0,0,0.13)"/>' +
      '<rect x="19" y="56" width="9" height="11" rx="4" fill="#8B6239"/>' +
      '<rect x="54" y="58" width="9" height="10" rx="4" fill="#8B6239"/>' +
      '<ellipse cx="42" cy="44" rx="32" ry="20" fill="#B98A5E"/>' +
      '<ellipse cx="40" cy="53" rx="21" ry="9" fill="#E4C9A5"/>' +
      '<circle cx="72" cy="15.5" r="6" fill="#8B6239"/>' +
      '<circle cx="78" cy="32" r="18" fill="#B98A5E"/>' +
      '<ellipse cx="92" cy="37" rx="9" ry="7" fill="#D8B48C"/>' +
      eyeArea +
      '<ellipse cx="96" cy="36" rx="2.6" ry="2" fill="#2A2620"/>' +
      extra +
      '</svg>';
  }

  function computeStreak() {
    if (state.allowance === null || isNaN(state.allowance)) return 0;
    var earliestKey = state.entries.reduce(function (min, e) { return (!min || e.date < min) ? e.date : min; }, null);
    if (!earliestKey) earliestKey = todayKey();
    var streak = 0;
    var cursor = new Date();
    cursor.setHours(0, 0, 0, 0);
    while (true) {
      var key = dayKey(cursor);
      if (key < earliestKey) break;
      var total = state.entries.filter(function (e) { return e.date === key && !e.bucket; })
        .reduce(function (sum, e) { return sum + e.amount; }, 0);
      if (total <= state.allowance) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else break;
    }
    return streak;
  }

  // ---------------------------------------------------------------
  // Buckets: a priority savings system. Every day's (allowance - spend)
  // on untagged entries adds to a shared pool. That pool fills the
  // Everyday bucket up to its target first, then overflows into Fun.
  // Logging an expense "from" a bucket subtracts it from that bucket's
  // balance and excludes it from the normal budget/streak math, since
  // it's funded from savings rather than that day's allowance.
  // ---------------------------------------------------------------
  function bucketTrackingDays() {
    if (!state.buckets.trackingStart) return 0;
    var start = new Date(state.buckets.trackingStart + 'T00:00:00');
    var end = new Date(todayKey() + 'T00:00:00');
    return Math.max(0, Math.round((end - start) / 86400000) + 1);
  }

  function bucketPool() {
    if (state.allowance === null || isNaN(state.allowance) || !state.buckets.trackingStart) return 0;
    var start = state.buckets.trackingStart;
    var end = todayKey();
    var untaggedSpent = state.entries
      .filter(function (e) { return e.date >= start && e.date <= end && !e.bucket; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
    return state.allowance * bucketTrackingDays() - untaggedSpent;
  }

  function bucketCashedOut(bucket) {
    return state.entries.filter(function (e) { return e.bucket === bucket; })
      .reduce(function (s, e) { return s + e.amount; }, 0);
  }

  function bucketBalance(bucket) {
    var pool = bucketPool();
    var target = state.buckets.everydayTarget;
    var effectiveTarget = (target !== null && !isNaN(target) && target > 0) ? target : 0;
    var everydayShare = Math.min(pool, effectiveTarget);
    var funShare = Math.max(0, pool - effectiveTarget);
    var raw = bucket === 'everyday' ? everydayShare : funShare;
    return raw - bucketCashedOut(bucket);
  }

  function bucketCardHtml(bucket) {
    var balance = bucketBalance(bucket);
    var target = bucket === 'everyday' ? state.buckets.everydayTarget : state.buckets.funTarget;
    var note = bucket === 'fun' ? state.buckets.funNote : '';
    var hasTarget = target !== null && !isNaN(target) && target > 0;
    var over = balance < 0;
    var pct = hasTarget ? Math.max(0, Math.min(100, Math.round(balance / target * 100))) : 0;
    return '<div class="bucket-card">' +
      '<div class="bucket-card-label">' + BUCKET_LABELS[bucket] + '</div>' +
      '<div class="bucket-card-amt ' + (over ? 'over' : 'good') + '">' + formatMoney(balance) + '</div>' +
      (hasTarget
        ? '<div class="cat-bar"><div class="cat-bar-fill' + (over ? ' over' : '') + '" style="width:' + (over ? 100 : pct) + '%"></div></div>' +
          '<p class="hint" style="margin-top:4px;">of ' + formatMoney(target) + (note ? ' — ' + note.replace(/</g, '&lt;') : '') + '</p>'
        : '') +
      '</div>';
  }

  function openCapybaraLightbox(variant, title, subtitle, muted) {
    var box = document.getElementById('capybaraLightbox');
    box.innerHTML = '<div class="capybara-lightbox-card">' +
      '<div style="opacity:' + (muted ? '0.35' : '1') + ';">' + capybaraSvg(variant, 200, !muted) + '</div>' +
      '<p>' + title + '</p>' +
      (subtitle ? '<p class="hint">' + subtitle + '</p>' : '') +
      '</div>';
    box.hidden = false;
  }

  function updateStreakBadge() {
    var el = document.getElementById('streakBadge');
    if (!el) return;
    if (state.allowance === null || isNaN(state.allowance)) { el.hidden = true; return; }
    var streak = computeStreak();
    el.hidden = false;
    el.innerHTML = capybaraSvg('plain', 16) + '<span>' + streak + (streak === 1 ? ' dags streak' : ' dagars streak') + '</span>';
  }

  function checkBadges() {
    var earned = state.badges.slice();
    var changed = false;
    function unlock(id) { if (earned.indexOf(id) === -1) { earned.push(id); changed = true; } }

    if (computeStreak() >= 7) unlock('streak7');

    if (state.allowance !== null && !isNaN(state.allowance)) {
      var todayPeriod = getMonthPeriod(new Date(), state.monthStartDay);
      var prevAnchor = shiftPeriod(todayPeriod, 'month', state.monthStartDay, -1);
      var prevPeriod = getMonthPeriod(prevAnchor, state.monthStartDay);
      var prevItems = entriesInPeriod(prevPeriod).filter(function (e) { return !e.bucket; });
      if (prevItems.length > 0) {
        var prevTotal = periodTotal(prevItems);
        var prevDays = Math.round((prevPeriod.end - prevPeriod.start) / 86400000) + 1;
        if (prevTotal <= state.allowance * prevDays) unlock('monthUnderBudget');
      }
    }

    if (state.entries.some(function (e) { return !!e.bucket; })) unlock('bucketCashout');

    var funTarget = state.buckets.funTarget;
    if (funTarget !== null && !isNaN(funTarget) && funTarget > 0) {
      var funBal = bucketBalance('fun');
      FUN_MILESTONES.forEach(function (pct) {
        if (funBal >= funTarget * (pct / 100)) unlock(funMilestoneBadgeId(pct));
      });
    }

    if (changed) { state.badges = earned; saveBadges(); }
  }

  function renderAnalysis() {
    var view = document.getElementById('analysisView');
    var type = analysisState.periodType;
    var period = getPeriod(type, analysisState.anchor, state.monthStartDay);
    var items = entriesInPeriod(period);
    var budgetItems = items.filter(function (e) { return !e.bucket; });
    var total = periodTotal(budgetItems);
    var days = Math.round((period.end - period.start) / 86400000) + 1;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var elapsedDays = days;
    if (period.start.getTime() > today.getTime()) {
      elapsedDays = 1;
    } else if (period.end.getTime() > today.getTime()) {
      elapsedDays = Math.round((today - period.start) / 86400000) + 1;
    }
    var mode = type === 'day' ? 'total' : analysisState.mode;
    var displayValue = mode === 'average' ? total / elapsedDays : total;
    var hasAllowance = state.allowance !== null && !isNaN(state.allowance);

    var html = '';
    html += '<div class="type-toggle" id="periodTypeToggle">' +
      ['day', 'month', 'year'].map(function (t) {
        var lbl = t === 'day' ? 'Day' : t === 'month' ? 'Month' : 'Year';
        return '<button type="button" class="type-btn' + (t === type ? ' active' : '') + '" data-type="' + t + '">' + lbl + '</button>';
      }).join('') + '</div>';

    if (!state.buckets.trackingStart) {
      html += '<div class="goal-block"><p class="hint">Set up the Everyday/Fun buckets in Settings to start saving toward purchases.</p></div>';
    } else if (!hasAllowance) {
      html += '<div class="goal-block"><p class="hint">Set a daily allowance to start saving into your buckets.</p></div>';
    } else {
      html += '<div class="goal-block"><div class="bucket-row">' + bucketCardHtml('everyday') + bucketCardHtml('fun') + '</div></div>';
    }

    html += '<div class="period-nav">' +
      '<button type="button" class="icon-btn" id="periodPrev" aria-label="Previous period">‹</button>' +
      '<span class="period-label">' + formatPeriodLabel(type, period) + '</span>' +
      '<button type="button" class="icon-btn" id="periodNext" aria-label="Next period">›</button>' +
      '</div>';

    html += '<div class="hero" style="padding:8px 0 14px;border-bottom:none;">' +
      '<p class="hero-amount mono">' + formatMoney(displayValue) + '</p>';
    if (hasAllowance) {
      var budget = mode === 'average' ? state.allowance : state.allowance * days;
      var diff = budget - displayValue;
      html += '<p class="hero-sub ' + (diff >= 0 ? 'good' : 'over') + '">' +
        (diff >= 0
          ? formatMoney(diff) + ' left of ' + formatMoney(budget)
          : formatMoney(Math.abs(diff)) + ' over ' + formatMoney(budget)) +
        (mode === 'average' ? ' per day' : '') + '</p>';
    }
    html += '</div>';

    if (type !== 'day') {
      html += '<div class="type-toggle" id="modeToggle" style="margin-bottom:16px;">' +
        '<button type="button" class="type-btn' + (mode === 'total' ? ' active' : '') + '" data-mode="total">Total</button>' +
        '<button type="button" class="type-btn' + (mode === 'average' ? ' active' : '') + '" data-mode="average">Avg / day</button>' +
        '</div>';
    }

    if (analysisState.drillCategory) {
      var catItems = items.filter(function (e) { return (e.category || UNCATEGORIZED) === analysisState.drillCategory; })
        .sort(function (a, b) { return b.ts - a.ts; });
      html += '<button type="button" class="scan-link" id="backToBreakdown" style="justify-content:flex-start;padding-left:0;">‹ Back</button>';
      html += '<h2 style="font-size:16px;margin:6px 0 10px;">' + analysisState.drillCategory + '</h2>';
      if (catItems.length === 0) {
        html += '<p class="hint">No transactions.</p>';
      } else {
        catItems.forEach(function (e) {
          html += '<div class="entry-row" data-id="' + e.id + '">' +
            '<span class="entry-desc">' + (e.description || '(no description)') +
            (e.bucket ? '<span class="entry-bucket-tag">' + BUCKET_LABELS[e.bucket] + '</span>' : '') + '</span>' +
            '<span class="entry-amount mono' + (e.amount < 0 ? ' refund' : '') + '">' + formatMoney(e.amount) + '</span>' +
            '</div>';
        });
      }
    } else {
      var breakdown = categoryBreakdown(items);
      if (breakdown.length === 0) {
        html += '<p class="hint" style="margin-top:20px;">Nothing logged in this period.</p>';
      } else {
        var basis = breakdown.reduce(function (s, b) { return s + Math.abs(b.total); }, 0) || 1;
        html += '<div class="cat-breakdown">';
        breakdown.forEach(function (b) {
          var pct = Math.round(Math.abs(b.total) / basis * 100);
          html += '<div class="cat-row" data-cat="' + b.category.replace(/"/g, '&quot;') + '">' +
            '<div class="cat-row-top"><span class="cat-name">' + b.category + '</span><span class="cat-amt">' + formatMoney(b.total) + '</span></div>' +
            '<div class="cat-bar"><div class="cat-bar-fill" style="width:' + pct + '%"></div></div>' +
            '</div>';
        });
        html += '</div>';
      }
    }

    view.innerHTML = html;
    bindAnalysisEvents();
  }

  function bindAnalysisEvents() {
    document.querySelectorAll('#periodTypeToggle .type-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        analysisState.periodType = btn.dataset.type;
        analysisState.drillCategory = null;
        renderAnalysis();
      });
    });
    var modeToggle = document.getElementById('modeToggle');
    if (modeToggle) {
      modeToggle.querySelectorAll('.type-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          analysisState.mode = btn.dataset.mode;
          renderAnalysis();
        });
      });
    }
    document.getElementById('periodPrev').addEventListener('click', function () {
      var period = getPeriod(analysisState.periodType, analysisState.anchor, state.monthStartDay);
      analysisState.anchor = shiftPeriod(period, analysisState.periodType, state.monthStartDay, -1);
      analysisState.drillCategory = null;
      renderAnalysis();
    });
    document.getElementById('periodNext').addEventListener('click', function () {
      var period = getPeriod(analysisState.periodType, analysisState.anchor, state.monthStartDay);
      analysisState.anchor = shiftPeriod(period, analysisState.periodType, state.monthStartDay, 1);
      analysisState.drillCategory = null;
      renderAnalysis();
    });
    var back = document.getElementById('backToBreakdown');
    if (back) back.addEventListener('click', function () { analysisState.drillCategory = null; renderAnalysis(); });
    document.querySelectorAll('.cat-row').forEach(function (row) {
      row.addEventListener('click', function () { analysisState.drillCategory = row.dataset.cat; renderAnalysis(); });
    });
    document.querySelectorAll('#analysisView .entry-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var entry = state.entries.find(function (e) { return e.id === row.dataset.id; });
        if (entry) openAddPanel(entry);
      });
    });
  }

  function render() {
    var historyView = document.getElementById('historyView');
    var analysisView = document.getElementById('analysisView');
    var analysisBtn = document.getElementById('openAnalysis');

    applySeasonTheme();
    checkBadges();
    updateStreakBadge();

    if (state.view === 'analysis') {
      document.getElementById('todayLabel').textContent = 'Analysis';
      historyView.hidden = true;
      analysisView.hidden = false;
      if (analysisBtn) analysisBtn.classList.add('primary');
      renderAnalysis();
      return;
    }
    historyView.hidden = false;
    analysisView.hidden = true;
    if (analysisBtn) analysisBtn.classList.remove('primary');

    document.getElementById('todayLabel').innerHTML = headerLabel() + holidayLabelSuffix(new Date());
    var todaysTotal = state.entries.filter(function (e) { return e.date === todayKey() && !e.bucket; })
      .reduce(function (sum, e) { return sum + e.amount; }, 0);
    document.getElementById('heroAmount').textContent = formatMoney(todaysTotal);

    var sub = document.getElementById('heroSub');
    if (state.allowance === null || isNaN(state.allowance)) {
      sub.textContent = 'Set your daily allowance to get started';
      sub.className = 'hero-sub neutral';
    } else {
      var diff = state.allowance - todaysTotal;
      if (diff >= 0) {
        sub.textContent = formatMoney(diff) + ' left of ' + formatMoney(state.allowance) + ' today';
        sub.className = 'hero-sub good';
      } else {
        sub.textContent = formatMoney(Math.abs(diff)) + ' over your ' + formatMoney(state.allowance) + ' today';
        sub.className = 'hero-sub over';
      }
    }

    var history = document.getElementById('history');
    history.innerHTML = '';
    var groups = groupByDay();
    if (groups.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing logged yet. Tap + to add your first expense.';
      history.appendChild(empty);
      return;
    }
    groups.forEach(function (g) {
      var section = document.createElement('div');
      section.className = 'day-group';
      var head = document.createElement('div');
      head.className = 'day-head';
      var name = document.createElement('span');
      name.className = 'day-name';
      name.textContent = dayLabel(g.date);
      head.appendChild(name);
      if (state.allowance !== null && !isNaN(state.allowance)) {
        var diff = document.createElement('span');
        var d = state.allowance - g.total;
        diff.className = 'day-diff ' + (d >= 0 ? 'good' : 'over');
        diff.textContent = d >= 0 ? formatMoney(d) + ' left' : formatMoney(Math.abs(d)) + ' over';
        head.appendChild(diff);
      } else {
        var tot = document.createElement('span');
        tot.className = 'day-diff';
        tot.style.color = 'var(--ink-soft)';
        tot.textContent = formatMoney(g.total);
        head.appendChild(tot);
      }
      section.appendChild(head);
      g.items.forEach(function (e) {
        var row = document.createElement('div');
        row.className = 'entry-row';
        row.addEventListener('click', function () { openAddPanel(e); });
        var desc = document.createElement('span');
        desc.className = 'entry-desc';
        desc.textContent = e.description || '(no description)';
        if (e.bucket) {
          var tag = document.createElement('span');
          tag.className = 'entry-bucket-tag';
          tag.textContent = BUCKET_LABELS[e.bucket];
          desc.appendChild(tag);
        }
        row.appendChild(desc);
        var amt = document.createElement('span');
        amt.className = 'entry-amount mono' + (e.amount < 0 ? ' refund' : '');
        amt.textContent = formatMoney(e.amount);
        row.appendChild(amt);
        var del = document.createElement('button');
        del.className = 'entry-del';
        del.setAttribute('aria-label', 'Delete entry');
        del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>';
        del.addEventListener('click', function (evt) { evt.stopPropagation(); deleteEntry(e.id); });
        row.appendChild(del);
        section.appendChild(row);
      });
      history.appendChild(section);
    });
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter(function (e) { return e.id !== id; });
    state.deletedIds.push({ id: id, deletedAt: Date.now() });
    saveEntries();
    saveDeletedIds();
    render();
    scheduleSync();
  }

  function findDuplicate(candidate, excludeId) {
    return state.entries.find(function (e) {
      if (excludeId && e.id === excludeId) return false;
      return e.date === candidate.date &&
        Math.abs(e.amount - candidate.amount) < 0.005 &&
        (e.description || '').trim().toLowerCase() === (candidate.description || '').trim().toLowerCase();
    });
  }

  function downloadCsv() {
    var rows = state.entries.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.ts - b.ts;
    });
    var lines = ['Date,Description,Amount (SEK),Category,Bucket'];
    rows.forEach(function (e) {
      var desc = '"' + String(e.description || '').replace(/"/g, '""') + '"';
      var cat = '"' + String(e.category || UNCATEGORIZED).replace(/"/g, '""') + '"';
      var bucket = e.bucket ? BUCKET_LABELS[e.bucket] : '';
      lines.push(e.date + ',' + desc + ',' + e.amount.toFixed(2) + ',' + cat + ',' + bucket);
    });
    var csv = lines.join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-export-' + todayKey() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  // Panel: one section at the top of the page, in normal document
  // flow (no fixed positioning), so it is always reachable and never
  // fights with the surrounding scroll container.

  var panel = document.getElementById('panel');
  var scanFile = document.getElementById('scanFile');
  var sampleFn = null;
  var parsedRows = [];
  var currentFlow = null;

  function showPanel() {
    panel.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function closePanel() {
    panel.hidden = true;
    panel.innerHTML = '';
  }

  function categoryChipsHtml(selected) {
    var html = '<div class="field"><label>Category</label><div class="cat-chips" id="catChips">';
    state.categories.forEach(function (c) {
      html += '<button type="button" class="cat-chip' + (c === selected ? ' active' : '') + '" data-cat="' + c.replace(/"/g, '&quot;') + '">' + c + '</button>';
    });
    html += '</div></div>';
    return html;
  }

  function bucketChipsHtml(selected) {
    var options = [{ id: '', label: 'None' }, { id: 'everyday', label: 'Everyday' }, { id: 'fun', label: 'Fun' }];
    var html = '<div class="field"><label>Fund from</label><div class="cat-chips" id="bucketChips">';
    options.forEach(function (o) {
      html += '<button type="button" class="cat-chip' + ((selected || '') === o.id ? ' active' : '') + '" data-bucket="' + o.id + '">' + o.label + '</button>';
    });

  }

  function openAddPanel(existingEntry) {
    var isEdit = !!existingEntry;
    var initialType = isEdit && existingEntry.amount < 0 ? 'refund' : 'expense';
    var initialAmount = isEdit ? Math.abs(existingEntry.amount).toFixed(2).replace('.', ',') : '';
    var initialDesc = isEdit ? existingEntry.description : '';
    var initialDate = isEdit ? existingEntry.date : todayKey();
    var selectedCategory = isEdit ? (existingEntry.category || null) : null;
    var selectedBucket = isEdit ? (existingEntry.bucket || null) : null;

    panel.innerHTML =
      '<h2>' + (isEdit ? 'Edit expense' : 'Log an expense') + '</h2>' +
      '<div class="field"><label for="amountInput">Amount</label>' +
      '<input type="text" inputmode="decimal" id="amountInput" class="mono-input" placeholder="0,00" autocomplete="off" value="' + initialAmount + '"></div>' +
      '<div class="field"><label>Type</label>' +
      '<div class="type-toggle">' +
      '<button type="button" class="type-btn' + (initialType === 'expense' ? ' active' : '') + '" id="typeExpense" data-type="expense">Expense</button>' +
      '<button type="button" class="type-btn' + (initialType === 'refund' ? ' active' : '') + '" id="typeRefund" data-type="refund">Refund (money back)</button>' +
      '</div></div>' +
      categoryChipsHtml(selectedCategory) +
      bucketChipsHtml(selectedBucket) +
      '<div class="field"><label for="descInput">What was it?</label>' +
      '<input type="text" id="descInput" placeholder="Coffee, bus fare, groceries…" autocomplete="off" value="' + initialDesc.replace(/"/g, '&quot;') + '"></div>' +
      '<div class="field"><label for="dateInput">Date</label>' +
      '<input type="date" id="dateInput" value="' + initialDate + '"></div>' +
      '<div id="dupWarning"></div>' +
      '<div class="panel-actions" id="addActions">' +
      '<button class="btn btn-secondary" id="cancelAdd">Cancel</button>' +
      '<button class="btn btn-primary" id="saveAdd">' + (isEdit ? 'Save changes' : 'Save') + '</button>' +
      '</div>' +
      (isEdit
        ? '<button class="scan-link" id="deleteEntryBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>Delete this entry</button>'
        : '<button class="scan-link" id="openScan" style="display:' + (sampleFn ? 'flex' : 'none') + ';">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/><circle cx="12" cy="12" r="3.2"/></svg>' +
          'Scan a bank screenshot instead</button>' +
          '<button class="scan-link" id="openImport">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 12h6m-6 4h6M8 4h5l4 4v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>' +
          'Paste expenses instead</button>');
    showPanel();
    setTimeout(function () { document.getElementById('amountInput').focus(); }, 50);

    var entryType = initialType;
    document.getElementById('typeExpense').addEventListener('click', function () {
      entryType = 'expense';
      this.classList.add('active');
      document.getElementById('typeRefund').classList.remove('active');
    });
    document.getElementById('typeRefund').addEventListener('click', function () {
      entryType = 'refund';
      this.classList.add('active');
      document.getElementById('typeExpense').classList.remove('active');
    });

    document.getElementById('cancelAdd').addEventListener('click', closePanel);

    document.querySelectorAll('#catChips .cat-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var cat = chip.dataset.cat;
        if (selectedCategory === cat) {
          selectedCategory = null;
          chip.classList.remove('active');
        } else {
          selectedCategory = cat;
          document.querySelectorAll('#catChips .cat-chip').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
        }
      });
    });

    document.querySelectorAll('#bucketChips .cat-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        selectedBucket = chip.dataset.bucket || null;
        document.querySelectorAll('#bucketChips .cat-chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
      });
    });

    function commitEntry(amount, desc, date) {
      if (isEdit) {
        existingEntry.amount = amount;
        existingEntry.description = desc;
        existingEntry.date = date;
        existingEntry.category = selectedCategory;
        existingEntry.bucket = selectedBucket;
        existingEntry.updatedAt = Date.now();
      } else {
        state.entries.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          date: date, amount: amount, description: desc, ts: Date.now(), updatedAt: Date.now(),
          category: selectedCategory, bucket: selectedBucket
        });
      }
      saveEntries();
      render();
      closePanel();
      scheduleSync();
    }

    document.getElementById('saveAdd').addEventListener('click', function () {
      var raw = document.getElementById('amountInput').value.replace(',', '.').replace('-', '');
      var magnitude = parseFloat(raw);
      var desc = document.getElementById('descInput').value.trim();
      var date = document.getElementById('dateInput').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = todayKey();
      if (isNaN(magnitude) || magnitude === 0) { document.getElementById('amountInput').focus(); return; }
      var amount = Math.round(magnitude * 100) / 100 * (entryType === 'refund' ? -1 : 1);

      var dup = findDuplicate({ date: date, amount: amount, description: desc }, isEdit ? existingEntry.id : null);
      if (dup) {
        document.getElementById('dupWarning').innerHTML =
          '<p class="dup-warning">You already logged ' + formatMoney(dup.amount) + ' for \u201c' + (dup.description || '(no description)') + '\u201d on that day. Save anyway?</p>';
        document.getElementById('addActions').innerHTML =
          '<button class="btn btn-secondary" id="rejectDup">Don\u2019t save</button>' +
          '<button class="btn btn-primary" id="acceptDup">Save anyway</button>';
        document.getElementById('rejectDup').addEventListener('click', closePanel);
        document.getElementById('acceptDup').addEventListener('click', function () { commitEntry(amount, desc, date); });
        return;
      }
      commitEntry(amount, desc, date);
    });

    if (isEdit) {
      document.getElementById('deleteEntryBtn').addEventListener('click', function () {
        deleteEntry(existingEntry.id);
        closePanel();
      });
    } else {
      document.getElementById('openScan').addEventListener('click', openScanPanel);
      document.getElementById('openImport').addEventListener('click', openImportPanel);
    }
  }

  function formatTimestamp(ms) {
    if (!ms) return 'never';
    var d = new Date(ms);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    return sameDay ? 'today at ' + timeStr : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' at ' + timeStr;
  }

    return '<div class="diag-block">' +
      '<p class="hint" style="margin-bottom:6px;"><strong>Local storage:</strong> ' + okLine + '</p>' +
      '<p class="hint" style="margin-bottom:6px;">' + state.entries.length + ' ' + (state.entries.length === 1 ? 'entry' : 'entries') + ' \u00b7 last saved ' + formatTimestamp(storageStatus.lastSaved) + '</p>' +

  function bindCategoryManage() {
    function renderList() {
      var wrap = document.getElementById('catManageList');
      wrap.innerHTML = state.categories.map(function (c, i) {
        return '<div class="cat-manage-row">' +
          '<input type="text" class="cat-manage-input" data-idx="' + i + '" value="' + c.replace(/"/g, '&quot;') + '">' +
          '<button type="button" class="cat-manage-del" data-idx="' + i + '" aria-label="Delete category">\u00d7</button></div>';
      }).join('');
      wrap.querySelectorAll('.cat-manage-input').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var i = +inp.dataset.idx;
          var oldName = state.categories[i];
          var newName = inp.value.trim();
          if (!newName || newName === oldName) { inp.value = oldName; return; }
          state.categories[i] = newName;
          state.entries.forEach(function (e) { if (e.category === oldName) e.category = newName; });
          saveCategories();
          saveEntries();
        });
      });
      wrap.querySelectorAll('.cat-manage-del').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var i = +btn.dataset.idx;
          var name = state.categories[i];
          state.categories.splice(i, 1);
          state.entries.forEach(function (e) { if (e.category === name) e.category = null; });
          saveCategories();
          saveEntries();
          renderList();
        });
      });
    }
    renderList();
    document.getElementById('addCatBtn').addEventListener('click', function () {
      var inp = document.getElementById('newCatInput');
      var name = inp.value.trim();
      if (!name || state.categories.indexOf(name) !== -1) return;
      state.categories.push(name);
      saveCategories();
      inp.value = '';
      renderList();
    });
  }
