document.addEventListener('DOMContentLoaded', function() {
    const redirectTitle = document.getElementById('redirect-title');
    const texts = ["Redirecting ...", "Redirecting .", "Redirecting .."];
    let index = 0;
    setInterval(() => {
        redirectTitle.textContent = texts[index];
        index = (index + 1) % texts.length;
    }, 300);
    setTimeout(() => {
        window.location.replace(window.location.origin + '/dr/dKwxT');
    }, 1500);
});
