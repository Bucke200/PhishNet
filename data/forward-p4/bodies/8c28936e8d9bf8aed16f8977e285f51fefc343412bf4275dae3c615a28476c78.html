<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            display: flex;
            align-items: center;
            height: 100vh;
            justify-content: center;
        }

        .content {
            width: 40%;
            margin-right: 50px;



        }

        .content h1 {
            color: blue;
            font-size:60px;

        }

        .content p {
            line-height: 1.3;
            margin-top: 5px;
            font-size: 30px;
        }

        .form{
            box-shadow: 0px 0px 4px;
            height: 400 px;
            width: 350px;
            padding: 20px;

        }
        .form > form > input{
            padding: 7px;
            width: 95%;
            margin: 9px;
            border-radius: 6px;
            border: 1px solid;
        }
        .form > form #first{
            width: 95%;
            margin: 9px;
            padding: 10px;
            background-color: blue;
            border-radius: 7px;
            border: 1px solid blue;
            color: white;
            font-weight: bold;
        }
        hr{
            margin: 13px;
        }
        .form > form #second{
            padding: 10px;
            display: block;
            margin: 28px auto;   
            color: white;
            font-weight: bold;
            background-color: lightgreen; 
            border-radius: 7px;
            border: 1px solid lightgreen;
       }

    </style>
</head>

<body>

    <div class="container">
        <div class="content">
            <h1>Facebook</h1>
            <p>Content and friends the world<br>around you on Facebook.</p>

        </div>
        <div class="form">
            <form>
                <input type="email" placeholder="Email or phone number"><br>
                <input type="password" name="Password" placeholder="Password">
                <button id="first">Login</button>
                <h5 style="color: blue; text-align: center; margin: 7px;" >Forget password?</h5>
                <hr>
                <button id="second">Create new account</button>
            </form>

        </div>
    </div>

</body>

</html>
