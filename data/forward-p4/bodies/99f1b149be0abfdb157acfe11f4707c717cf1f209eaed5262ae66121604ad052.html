<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Nie znaleziono strony</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e3e5e8;
    border-radius: 12px;
    max-width: 640px;
    width: 100%;
    padding: 80px 32px;
    text-align: center;
  }
  .code {
    font-size: 88px;
    font-weight: 500;
    line-height: 1;
    color: #042C53;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #185FA5;
    background: #E6F1FB;
    padding: 6px 14px;
    border-radius: 8px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 16px;
    line-height: 1.3;
    color: #042C53;
  }
  p {
    font-size: 16px;
    color: #5f5e5a;
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto 28px;
  }
  a.btn {
    display: inline-block;
    background: #042C53;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 24px;
    border-radius: 8px;
    transition: background 0.2s ease;
  }
  a.btn:hover { background: #0C447C; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Błąd 404</span>
    <div class="code">404</div>
    <h1>Nie znaleziono strony</h1>
    <p>Strona, której szukasz, nie istnieje lub została przeniesiona.</p>
    <a class="btn" href="/index">Wróć na stronę główną</a>
  </div>
</body>
</html>
