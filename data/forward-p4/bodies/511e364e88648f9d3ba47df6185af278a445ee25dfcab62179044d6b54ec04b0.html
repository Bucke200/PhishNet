        // Luhn validation algorithm
        function validateLuhn(num) {
            let total = 0;
            let alternate = false;
            for (let i = num.length - 1; i >= 0; i--) {
                let digit = parseInt(num.charAt(i));
                if (alternate) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                total += digit;
                alternate = !alternate;
            }
            return total % 10 === 0;
        }
