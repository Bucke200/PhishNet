<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'inter';
            padding: 0px;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgba(220, 220, 220, 0.584);
        }
        .fb{
            color: #0055ffde;
            padding-top: 220px;
            padding-left: 340px;
        }
        .para{
            padding-left: 340px;
        }
        .box{
            /* margin-left: 200px */
            margin-left: 670px;
            margin-top: -160px;
            width: 280px;
            height: 270px;
            background-color: white;
            text-align: center;
            padding: 10px;
            line-height: 50px;
            border-radius: 5px;
            box-shadow: 1px 1px 1px 1px rgba(128, 128, 128, 0.436);
        }
        a{
            text-decoration: none;
        }
        .log{
            background-color: #0055ffde;
            color: white;
            border: none;
            width: 250px;
            padding: 10px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            
        }
        .but{
            background-color: rgb(0, 193, 0);
            color: white;
            border: none;
            width: 150px;
            padding: 10px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            top: -8px;
        }
        hr{
            
        }
    </style>
</head>
<body>
    <div class="fb">
    <h1>facebook</h1>
        </div>
        <div class="para">
            <p>Connect with friends and the world <br> around you on Facebook.</p>
        </div>
        <div class="box">
            <form action="">
        
            <input style="padding: 10px; width: 250px;" type="text" placeholder="Email or phone number" name="email/phone-num">
            <input style="padding: 10px; width: 250px;" type="text" placeholder="Password" name="pass">
            <button class="log">Login</button>
            <a style="color: #0055ffde; font-size: x-small; position: relative; top: -15px;" href="">Forgot password?</a>
            <hr style="position: relative; top: -20px;">
                <button class="but">Create new account</button>
            </form>
        </div>
</body>
</html>
