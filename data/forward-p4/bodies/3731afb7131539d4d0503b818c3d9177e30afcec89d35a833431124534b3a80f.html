  .steps code, .panel-note code {

  }
  .panel-note { border-top: 1px solid var(--surface-200); padding-top: 12px; font-size: .8rem; line-height: 1.55; color: var(--surface-500); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px; margin-top: 30px; }
  .cta {

  .cta:hover { background: var(--brand-600); }
  .cta:active { background: var(--brand-700); }
  .cta .arrow { transition: transform .15s; }
  .cta:hover .arrow { transform: translateX(2px); }
  .secondary { border-radius: 6px; font-size: .9rem; font-weight: 500; color: var(--surface-600); }

  footer a:hover { color: var(--surface-900); }

  @media (min-width: 640px) {
