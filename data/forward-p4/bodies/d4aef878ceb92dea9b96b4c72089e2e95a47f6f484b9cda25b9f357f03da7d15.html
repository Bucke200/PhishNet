<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Preview unavailable - PreviewShip</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18181b;
      background: #fafafa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(250,250,250,.98)),
        radial-gradient(circle at top, rgba(24,24,27,.08), transparent 36rem);
    }
    main {
      width: min(100%, 720px);
      border: 1px solid #e4e4e7;
      border-radius: 18px;
      background: #fff;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 0 24px 80px rgba(24,24,27,.08);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e4e4e7;
      border-radius: 999px;
      padding: 6px 12px;
      color: #71717a;
      font-size: 13px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #a1a1aa;
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      max-width: 58ch;
      color: #52525b;
      font-size: 17px;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .primary {
      background: #18181b;
      color: #fff;
    }
    .secondary {
      border: 1px solid #d4d4d8;
      color: #18181b;
      background: #fff;
    }
    .note {
      margin-top: 22px;
      color: #71717a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span><span data-i18n="eyebrow">Preview unavailable</span></div>
    <h1 data-i18n="title">This preview is temporarily unavailable.</h1>
    <p data-i18n="description">The project owner can sign in to PreviewShip to review the reason and restore this link.</p>
    <div class="actions">
      <a class="primary" href="https://previewship.com/projects?from=unavailable_preview" data-i18n="primary">Project owner sign in</a>
    </div>
  </main>
  <script>
    (function () {
      var copies = {
        en: {
          pageTitle: 'Preview unavailable - PreviewShip',
          eyebrow: 'Preview unavailable',
          title: 'This preview is temporarily unavailable.',
          description: 'The project owner can sign in to PreviewShip to review the reason and restore this link.',
          primary: 'Project owner sign in',
          secondary: 'Open dashboard',
          note: 'You may need to sign in before upgrading or redeploying this project.'
        },
        pt: {
          pageTitle: 'Preview indisponível - PreviewShip',
          eyebrow: 'Preview indisponível',
          title: 'Este preview está temporariamente indisponível.',
          description: 'O proprietário do projeto pode entrar no PreviewShip para verificar o motivo e restaurar este link.',
          primary: 'Entrar como proprietário',
          secondary: 'Abrir dashboard',
          note: 'Talvez você precise entrar na conta antes de fazer upgrade ou redeployar este projeto.'
        },
        'zh-CN': {
          pageTitle: '预览暂时不可用 - PreviewShip',
          eyebrow: '预览暂时不可用',
          title: '此预览暂时不可用。',
          description: '项目所有者可以登录 PreviewShip 查看原因并恢复此链接。',
          primary: '项目所有者登录',
          secondary: '打开控制台',
          note: '升级或重新部署这个项目之前，你可能需要先登录。'
        },
        'zh-TW': {
          pageTitle: '預覽暫時無法使用 - PreviewShip',
          eyebrow: '預覽暫時無法使用',
          title: '此預覽暫時無法使用。',
          description: '專案所有者可以登入 PreviewShip 查看原因並恢復此連結。',
          primary: '專案所有者登入',
          secondary: '打開控制台',
          note: '升級或重新部署這個專案之前，你可能需要先登入。'
        },
        es: {
          pageTitle: 'Preview no disponible - PreviewShip',
          eyebrow: 'Preview no disponible',
          title: 'Este preview no está disponible temporalmente.',
          description: 'El propietario del proyecto puede iniciar sesión en PreviewShip para revisar el motivo y restaurar este enlace.',
          primary: 'Acceso del propietario',
          secondary: 'Abrir panel',
          note: 'Es posible que debas iniciar sesión antes de mejorar o redeplegar este proyecto.'
        },
        fr: {
          pageTitle: 'Preview indisponible - PreviewShip',
          eyebrow: 'Preview indisponible',
          title: 'Ce preview est temporairement indisponible.',
          description: 'Le propriétaire du projet peut se connecter à PreviewShip pour consulter la raison et restaurer ce lien.',
          primary: 'Connexion du propriétaire',
          secondary: 'Ouvrir le tableau de bord',
          note: 'Vous devrez peut-être vous connecter avant de passer à Pro ou de redéployer ce projet.'
        },
        ja: {
          pageTitle: 'プレビューを利用できません - PreviewShip',
          eyebrow: 'プレビューを利用できません',
          title: 'このプレビューは一時的に利用できません。',
          description: 'プロジェクト所有者は PreviewShip にログインして理由を確認し、このリンクを復元できます。',
          primary: '所有者としてログイン',
          secondary: 'ダッシュボードを開く',
          note: 'アップグレードまたは再デプロイの前にログインが必要な場合があります。'
        },
        ko: {
          pageTitle: '미리보기를 사용할 수 없음 - PreviewShip',
          eyebrow: '미리보기를 사용할 수 없음',
          title: '이 미리보기는 일시적으로 사용할 수 없습니다.',
          description: '프로젝트 소유자는 PreviewShip에 로그인하여 사유를 확인하고 이 링크를 복원할 수 있습니다.',
          primary: '프로젝트 소유자 로그인',
          secondary: '대시보드 열기',
          note: '업그레이드하거나 이 프로젝트를 다시 배포하기 전에 로그인해야 할 수 있습니다.'
        }
      };
      var lang = (navigator.language || 'en').toLowerCase();
      var key = 'en';
      if (lang.indexOf('pt') === 0) key = 'pt';
      else if (lang.indexOf('zh') === 0) key = lang.indexOf('tw') > -1 || lang.indexOf('hk') > -1 || lang.indexOf('hant') > -1 ? 'zh-TW' : 'zh-CN';
      else if (lang.indexOf('ja') === 0) key = 'ja';
      else if (lang.indexOf('ko') === 0) key = 'ko';
      else if (lang.indexOf('es') === 0) key = 'es';
      else if (lang.indexOf('fr') === 0) key = 'fr';
      var copy = copies[key] || copies.en;
      document.documentElement.lang = key;
      document.title = copy.pageTitle;
      document.querySelectorAll('[data-i18n]').forEach(function (node) {
        var value = copy[node.getAttribute('data-i18n')];
        if (value) node.textContent = value;
      });
    })();
  </script>
</body>
</html>
