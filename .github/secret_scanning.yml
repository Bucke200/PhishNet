# Secret-scanning exclusions (alerts auto-close as "ignored by configuration";
# excluded paths also skip push-protection checks).
#
# WHY: data/raw/** and data/forward-p4/** are machine-generated threat-intel
# corpora (phishing-feed snapshots, phishing-page extracts). Attacker-controlled
# strings in them routinely match credential patterns (AWS-shaped tokens in kit
# URLs, bot tokens in exfil code). None of it is a repo credential — Phase 0
# rotated those — and push protection has blocked the daily collect pipeline
# over feed strings twice (2026-09-18/19). The exclusion is narrow on purpose:
# hand-written code, configs and model assets stay fully scanned.
paths-ignore:
  # Daily feed snapshots (collect.yml append-only log). Never hand-edited.
  - "data/raw/**"
  # Forward-collection corpus (forward-p4-data branch). Same class of data.
  - "data/forward-p4/**"
