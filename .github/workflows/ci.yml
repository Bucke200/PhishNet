name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TLDEXTRACT_CACHE: .tld_cache

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Fetch model artifacts (SHA256-verified, git-ignored)
        run: uv run python -m phishnet.verified_download

      - name: Place tier-1 row-(a) assets (release-pinned, git-ignored)
        run: |
          mkdir -p backend/ablation_lexical_assets
          cp src/phishnet/urlset_ml_assets/ablation_lexical_gbm_model.pkl backend/ablation_lexical_assets/gbm_model.pkl
          cp src/phishnet/urlset_ml_assets/ablation_lexical_feature_columns.pkl backend/ablation_lexical_assets/feature_columns.pkl
          # train_config.json is tracked in git; the two weights arrive above.

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Type-check with mypy
        run: uv run mypy src tests ml_training
