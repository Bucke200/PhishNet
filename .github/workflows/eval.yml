name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Fetch model artifacts (SHA256-verified, git-ignored)
        run: uv run python -m phishnet.verified_download
      - run: uv run ruff check .
      - run: uv run mypy eval.py predictors.py
      - run: uv run python -m pytest -q tests test_eval.py

      # The test split is committed, so this is deterministic and needs no
      # network. Any PR that moves recall backwards fails here. Until the
      # first split lands (Phase 1 collection still accumulating), there is
      # nothing to score, so skip instead of failing.
      - name: Evaluate candidate model
        run: |
          if [ ! -f data/splits/test.csv ]; then
            echo "no data/splits/test.csv yet -- skipping model evaluation"
            exit 0
          fi
          uv run python eval.py \
            --predictor "${{ vars.CANDIDATE_PREDICTOR || 'predictors:UrlShapeHeuristic' }}" \
            --dataset data/splits/test.csv \
            --compare reports/baseline.json \
            --tag pr \
            --fail-under-recall "${{ vars.MIN_RECALL || '0.0' }}"

      - name: Post report to the PR
        if: github.event_name == 'pull_request' && hashFiles('reports/pr.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: reports/pr.md

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          if-no-files-found: ignore
